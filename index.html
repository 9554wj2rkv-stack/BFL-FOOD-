<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-title" content="BFL Food">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Body Fuel Lab – Food Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  BFL FOOD — version 2, rebuilt from scratch on layout 4 ("Dark focus"), with Light / Dark / System.
  Three tabs: Today, Foods, Me. Data keys (bflfood_*) are the same as version 1, so logged food,
  your plan, food profile, favourites, own foods and weight check-ins carry over.
  The engine (calculations, food list, barcode lookup, safety checks) is copied unchanged.
  Oct 2026: Fibre and total sugar rows in the main overview on Today (fibre and total/added sugar, read from logged portions; never changes kcal or carbs).
  Oct 2026: Smart Fuel Coach on Today (rule-based guidance, meal planning and suggestions; never logs on its own).
  Oct 2026: Save new product → Food Library (same storage as your own foods, bflfood_customfoods).
  Oct 2026: one unified food catalogue with a source on every food (Frida preferred, USDA FoodData Central
  as fallback, original Body Fuel Lab foods marked "Unverified"), plus Quick Estimate. No live Frida connection.
-->
<style>
/* Layout 4: one calm column — a budget card, one big log button, repeat chips, today's log. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --raise:#F4F4F6; --line:#E2E2E6; --line-2:#C9C9D0;
  --ink:#0D0D0D; --ink-2:#36363A; --muted:#5A5A62; --track:#E6E6EA;
  --btn:#0D0D0D; --on-btn:#FFFFFF; --pill:#F1F1F3; --seg-on:#FFFFFF; --overlay:rgba(0,0,0,.42);
  --prot:#628EC8; --carb:#D99B50; --fat:#78A98A; --over:#C9572A; --ok:#2E7A60;
  --alert:#A3192F; --alert-bg:#FDE7EA; --warn:#6B4A0C; --warn-bg:#FBF0D9;
  --m-b:#E5C33A; --m-l:#6DBB86; --m-d:#7FA7EA; --m-s:#EE9670;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;
  color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#101010; --card:#101010; --raise:#1E1E21; --line:#2F2F33; --line-2:#48484E;
  --ink:#FFFFFF; --ink-2:#E0E0E4; --muted:#A8A8B0; --track:#38383D;
  --btn:#F2F2F2; --on-btn:#101010; --pill:#2A2A2E; --seg-on:#3A3A40; --overlay:rgba(0,0,0,.65);
  --over:#F0905E; --ok:#6CC39B;
  --alert:#FF8C9C; --alert-bg:#3A1A1F; --warn:#F3C46B; --warn-bg:#33280F;
  color-scheme:dark;
}
/* Mint and Barbie: the colours of the sister app, Body Fuel Lab */
:root[data-app-theme="mint"]{
  --bg:#A9E2BF; --card:#FFFFFF; --raise:#D6F2E2; --line:#86C3A0; --line-2:#4F8E6E;
  --ink:#11281E; --ink-2:#1B3329; --muted:#2F5444; --track:#D3ECDD;
  --btn:#147A5A; --on-btn:#FFFFFF; --pill:#E6F7EE; --seg-on:#FFFFFF; --overlay:rgba(10,40,25,.45);
  --ok:#147A5A; --accent:#147A5A;
}
:root[data-app-theme="barbie"]{
  --bg:#FFE6F2; --card:#FFFFFF; --raise:#FFD6EA; --line:#F6B3D3; --line-2:#D9739F;
  --ink:#3D0A24; --ink-2:#5E1838; --muted:#7E2A52; --track:#FFDCEE;
  --btn:#C2156F; --on-btn:#FFFFFF; --pill:#FFFFFF; --seg-on:#FFFFFF; --overlay:rgba(61,10,36,.45);
  --accent:#C2156F;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--prot);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
p{margin:0}
main{padding-block:26px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.page{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* shared */
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:16px}
.small{font-size:15px}
.pill{font-size:15px;font-weight:700;background:var(--pill);padding:6px 12px;border-radius:999px;white-space:nowrap}
.card{border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:18px;background:var(--card)}
.h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.head-date{font-size:17px;font-weight:700;color:var(--ink-2)}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:6px}
.big.over{color:var(--over)}
.mrow{display:flex;flex-direction:column;gap:8px}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.mrow-top .n{font-size:21px;font-weight:600}
.mrow-top .v{font-size:21px;font-weight:700;white-space:nowrap}
.mrow-top .v span{color:var(--muted);font-weight:600}
.mrow-left{font-size:19px;font-weight:800;letter-spacing:.01em;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:-1px}
.mrow-left.over{color:var(--over)}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;max-width:100%;transition:width .3s}
.bar.p i{background:var(--prot)} .bar.c i{background:var(--carb)} .bar.f i{background:var(--fat)} .bar i.over{background:var(--over)}
.fluids{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.fluids b{color:var(--ink);font-size:19px}
.btn-main{border:0;background:var(--btn);color:var(--on-btn);border-radius:999px;min-height:60px;width:100%;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px}
.btn-main:active{transform:scale(.985)}
.btn-main:disabled{opacity:.45}
.btn-line{border:1.5px solid var(--line-2);background:transparent;color:var(--ink);border-radius:999px;min-height:48px;padding:0 18px;font-size:17px;font-weight:600}
.btn-danger{border:1.5px solid var(--alert);background:transparent;color:var(--alert);border-radius:999px;min-height:48px;padding:0 18px;font-size:17px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:transparent;color:var(--ink);border-radius:999px;min-height:46px;padding:0 16px;font-size:16px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--raise);padding:4px;border-radius:16px}
.seg button{border:0;background:transparent;border-radius:12px;min-height:46px;font-size:16px;font-weight:700;color:var(--muted);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg button small{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button.on small{color:var(--ink-2)}
.note{border-radius:14px;padding:12px 14px;font-size:16px;background:var(--raise);color:var(--ink-2)}
.note.alert{background:var(--alert-bg);color:var(--alert);font-weight:600}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note button{margin-top:8px}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:3px;padding:8px 0;min-height:44px}

/* today's log */
.log{display:flex;flex-direction:column}
.log-h{display:flex;align-items:center;gap:10px;padding:16px 0 6px;font-size:18px;font-weight:700}
.log-h .k{margin-left:auto;font-size:16px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.Breakfast{background:var(--m-b)} .dot.Lunch{background:var(--m-l)} .dot.Dinner{background:var(--m-d)} .dot.Snacks{background:var(--m-s)}
.row{width:100%;display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:13px 0;min-height:58px;color:var(--ink)}
.row .n{flex:1;min-width:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.row .n small{display:block;font-size:15px;color:var(--muted);font-weight:500;margin-top:1px}
.row .k{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .k.mute{color:var(--muted);font-weight:600}
.row .warn-dot{width:10px;height:10px;border-radius:50%;background:var(--alert);flex:none}
.empty{color:var(--muted);font-size:17px;padding:8px 0}

/* forms */
label.lbl{display:block;font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;min-height:52px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:17px}
.inp::placeholder{color:var(--muted);opacity:1}
.inp:focus{outline:none;border-color:var(--ink)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 14px) 23px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:999px;background:var(--raise)}
.search input{border:0;background:transparent;flex:1;min-width:0;min-height:52px;font-size:18px;outline:none;color:var(--ink)}
.search svg{flex:none}
details.fold{border:1px solid var(--line);border-radius:18px}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;min-height:58px;font-size:18px;font-weight:700;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:22px;color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold .fold-b{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* reuse classes the engine's forms and explanations print */
.note.plain,.note.info{background:var(--raise);color:var(--ink-2)}
.note.caution{background:var(--warn-bg);color:var(--warn)}
.btn{border:1.5px solid var(--line-2);background:transparent;color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font-size:16px;font-weight:600}
.btn-primary{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.group-h{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:72px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
.nav button.on{color:var(--ink)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet-back{position:fixed;inset:0;background:var(--overlay);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:max(28px,env(safe-area-inset-top,0px));z-index:41;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;flex:1;font-size:20px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-body>.stack{max-width:520px;margin:0 auto}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slots button{min-height:46px;border-radius:14px;border:1.5px solid var(--line-2);background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:0 2px;display:flex;align-items:center;justify-content:center;gap:6px}
.slots button.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.res{display:flex;flex-direction:column}
.portion-amt{display:flex;align-items:center;gap:10px}
.portion-amt input{width:130px;text-align:center;font-size:28px;font-weight:800;min-height:62px}
.portion-amt span{font-size:20px;font-weight:700;color:var(--muted)}
.portion-amt .eq{font-size:18px;color:var(--ink-2)}
.result{display:flex;flex-direction:column;gap:4px}
.result p.big{margin:0;font-size:40px;color:var(--ink)}
.result p{font-size:17px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--btn);color:var(--on-btn);padding:10px 10px 10px 18px;border-radius:999px;font-weight:700;font-size:16px;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:up .2s ease}
.toast span{min-width:0}
.toast button{border:0;background:transparent;color:var(--on-btn);font-weight:800;text-decoration:underline;min-height:40px;padding:0 8px}
.toast.plain{padding-right:18px}
/* date navigation */
.day-nav{display:flex;align-items:center;gap:2px;min-width:0}
.day-nav .head-date{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:center;padding:0 2px}
.day-nav .cr-arrow{width:34px;height:40px;flex:none}
.back-today{align-self:flex-start;border:0;background:var(--btn);color:var(--on-btn);border-radius:999px;min-height:40px;padding:0 16px;font-size:15px;font-weight:800;margin-top:-10px}
.nl-day{font-size:24px;font-weight:800;margin:6px 0 2px}
.day-clear{align-self:flex-start;font-size:14px;color:var(--muted);margin-top:6px}
.day-notes .bi-recs{font-size:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-size:19px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-dow{font-size:13px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-d{position:relative;border:0;background:transparent;color:var(--ink);border-radius:12px;min-height:46px;font-size:17px;font-weight:600;padding:0}
.cal-d.has{font-weight:800;background:var(--raise)}
.cal-d i{position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ok)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cal-d.sel{background:var(--btn);color:var(--on-btn)}.cal-d.sel i{background:var(--on-btn)}
.cal-d:disabled{color:var(--muted);opacity:.4}
.cal-key{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px}
/* smart fuel */
.sf-card{padding:0;gap:0}
.sf-head b{font-size:20px}
.sf-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:8px}
.sf-day{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:17px}
.sf-day span{min-width:110px;text-align:center}
.sf-rems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sf-rem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.sf-rem b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.sf-rem span{font-size:13px;color:var(--muted);font-weight:600}
.sf-rem.over b{color:var(--over)}
.sf-list{display:flex;flex-direction:column;gap:12px}
.sf-idea{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sf-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sf-top b{font-size:19px;font-weight:800}
.sf-ing{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.sf-ing .n{flex:1;min-width:0;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.sf-ing small{display:block;font-size:14px;color:var(--muted);font-weight:500}
.sf-step{display:flex;gap:6px;flex:none}
.sf-step .icon-btn{font-size:22px;font-weight:700;width:42px;height:42px}
.sf-nut{font-size:17px}
.sf-prev{font-size:15px;color:var(--ink-2);background:var(--raise);border-radius:12px;padding:8px 10px}
.sf-acts{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sf-kit{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sf-kit-top{display:flex;align-items:flex-start;gap:8px}
.sf-kit-top .n{flex:1;min-width:0;font-size:17px;font-weight:700}
.sf-kit-top small{display:block;font-size:14px;color:var(--muted);font-weight:500}
.sf-av button{min-height:40px;font-size:15px}
.sf-saved{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
/* evidence */
.nd-card{gap:14px}
.mrow#m-sug .mrow-top{margin-bottom:0}
.nd-inc-line{margin-top:-8px}
.bar.fib i{background:var(--ink-2)}
.nd-left{color:var(--ink-2)}
.nd-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.nd-row .n{font-size:18px;font-weight:700}
.nd-row .n small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.nd-row b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.nd-inc{font-size:15px}
.nd-amt{margin-top:2px}
.co-q{display:flex;flex-direction:column;gap:8px}
.co-acts .chip{font-size:15px}
.co-guide{border:1.5px solid var(--line-2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.co-head{font-size:18px;font-weight:700;line-height:1.4;color:var(--ink)}
.co-saved{font-size:15px;font-weight:700;color:var(--ok);min-height:20px;margin:-4px 0}
.co-for{margin:4px 0 -6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.co-alloc{display:flex;flex-direction:column}
.co-row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 0}
.co-row .n{flex:1;min-width:0;font-size:17px;font-weight:700}
.co-row .n small{display:block;font-size:14px;color:var(--muted);font-weight:500}
.co-k{width:130px;flex:none}

  var FOOD_ALIASES={
    chicken:["kylling"],chicken_breast:["kylling","kyllingebryst"],turkey:["kalkun"],
    beef_mince:["oksekod","hakket oksekod","hakkekod"],beef_steak:["oksekod","bof","oksemorbrad"],

    peas:["aerter"],cucumber:["agurk"],carrots:["gulerodder","gulerod"],blueberries:["blabaer"],raspberries:["hindbaer"],

    olive_oil:["olivenolie"],butter:["smor"],mayo:["mayonnaise"],ghee:["ghee"],honey:["honning"]

  function foodSearchNorm(s){return String(s||"").toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a");}
  var FOOD_SEARCH_INDEX=null;
  function buildFoodSearchIndex(){
    FOOD_SEARCH_INDEX=FOODDB.map(function(d){
      var terms=[d.name].concat(FOOD_ALIASES[d.k]||[]);
      return {d:d,hay:foodSearchNorm(terms.join(" | "))};
    });
  }
  function fmt1(n){n=+n||0;return Math.round(n*10)/10;}
  function searchFoods(query,limit){
    limit=limit||8;
    if(!FOOD_SEARCH_INDEX)buildFoodSearchIndex();
    var q=foodSearchNorm(query).trim();
    if(!q)return [];
    var out=[];
    FOOD_SEARCH_INDEX.forEach(function(e){
      if(e.hay.indexOf(q)<0)return;
      Object.keys(e.d.s).forEach(function(st){out.push({d:e.d,state:st});});
    });
    return out.slice(0,limit);
  }
  function renderMlSearchResults(query){

  /* ===== VERBATIM: Open Food Facts lookup, parsing, status messages ===== */
  /* ---------- barcode lookup via Open Food Facts (read-only, single request per scan) ---------- */
  /* NOTE: We do NOT send a custom User-Agent header. Browsers treat "User-Agent" as a
     non-safelisted header, which forces a CORS preflight (OPTIONS) request. Open Food Facts'
     API does not include "User-Agent" in Access-Control-Allow-Headers for that preflight, so
     the browser blocks the real GET before it's ever sent -- this is what caused every real
     lookup on GitHub Pages/Safari to fail with a generic network error, even though the exact
     same request worked in mocked testing (mocks don't enforce CORS). Keeping this request to
     only CORS-safelisted headers (no custom headers at all) avoids the preflight entirely. */
  var OFF_APP_ID="BodyFuelLab/1.0";
  var OFF_MIN_INTERVAL_MS=1200;
  function offBuildUrl(barcode){
    return "https://world.openfoodfacts.org/api/v3/product/"+encodeURIComponent(barcode)+".json?fields=code,product_name,product_name_en,brands,serving_size,nutriments";
  }
  function offFetchProduct(barcode){
    return fetch(offBuildUrl(barcode),{method:"GET"}).then(function(r){
      if(!r.ok)throw new Error("network");
      return r.json();
    });
  }
  function offParseProduct(data,barcode){
    if(!data)return {found:false};
    var okStatus=data.status===1||data.status==="1"||data.status==="success";
    if(!okStatus||!data.product)return {found:false};
    var p=data.product,n=p.nutriments||{};
    var kcal=n["energy-kcal_100g"];if(kcal==null)kcal=n["energy-kcal"];
    var protein=n["proteins_100g"],carbs=n["carbohydrates_100g"],fat=n["fat_100g"],fib=n["fiber_100g"];
    var complete=kcal!=null&&protein!=null&&carbs!=null&&fat!=null;
    return {
      found:true,complete:complete,
      barcode:data.code||p.code||barcode,
      name:p.product_name||p.product_name_en||"",
      brand:p.brands||"",
      serving:p.serving_size||"",
      kcal:kcal,protein:protein,carbs:carbs,fat:fat,fib:fib
    };
  }
  function renderScanMsg(msg){var el=$("#ml-scan-result");if(el)el.innerHTML=msg?('<p class="ml-quick-empty">'+msg+'</p>'):'';}
  function renderScanNotFound(reason){
    var box=$("#ml-scan-result");if(!box)return;
    box.innerHTML='<p class="ml-quick-empty">'+esc(reason)+' You can use manual macro entry instead.</p>'
      +'<button type="button" class="linkbtn" id="ml-scan-manual">\u270e Enter macros manually</button>';
  }

  /* ===== VERBATIM (storage key names only → prefixed constants): serving units + OFF favourites ===== */
  /* ---------- reusable serving units (general feature, additive only) ----------
     Stored separately from FOODDB and from bf_foodfav so neither existing structure
     is altered. Keyed by a food "identity": the FOODDB key for built-in foods, or
     "off:"+barcode for Open Food Facts products. A food with no saved serving simply
     has no entry here and keeps working in grams exactly as before. */
  function offIdentity(barcode){return "off:"+barcode;}
  function loadServingUnits(identity){var all=store.get(KEY_SERVINGUNITS)||{};return all[identity]||[];}
  function saveServingUnit(identity,name,grams){
    var all=store.get(KEY_SERVINGUNITS)||{};
    var arr=(all[identity]||[]).filter(function(s){return s.name.toLowerCase()!==name.toLowerCase();});
    arr.push({name:name,grams:grams});
    all[identity]=arr;store.set(KEY_SERVINGUNITS,all);
    return arr;
  }
  /* ---------- Open Food Facts favourites (separate from bf_foodfav, which stays FOODDB-key-only) ---------- */
  function loadOffFav(){return store.get(KEY_OFFFAV)||[];}
  function saveOffFavList(arr){store.set(KEY_OFFFAV,arr);}
  function findOffFavIdx(barcode){var arr=loadOffFav();for(var i=0;i<arr.length;i++){if(arr[i].barcode===barcode)return i;}return -1;}
  function isOffFav(barcode){return findOffFavIdx(barcode)>=0;}
  function toggleOffFav(info){
    var arr=loadOffFav(),idx=findOffFavIdx(info.barcode);
    if(idx>=0)arr.splice(idx,1);
    else arr.push({barcode:info.barcode,name:info.name,brand:info.brand,kcal:info.kcal,protein:info.protein,carbs:info.carbs,fat:info.fat,fib:info.fib});
    saveOffFavList(arr);
  }
  function parseServingGrams(s){
    if(!s)return null;
    var m=String(s).match(/(\d+(?:[.,]\d+)?)\s*g\b/i);
    if(!m)return null;
    var n=parseFloat(m[1].replace(",","."));
    return isFinite(n)?n:null;
  }

  /* ===== VERBATIM: shared serving-picker UI ===== */
  /* ---------- shared serving-picker UI (used by both FOODDB items and Open Food Facts items) ---------- */
  function servingBlockHTML(identity,hint){

    units.forEach(function(u,i){html+='<button type="button" class="serv-chip'+((mode==="unit"&&selIdx===i)?" on":"")+'" data-servmode="unit" data-servidx="'+i+'">'+esc(u.name)+'</button>';});
    html+='<button type="button" class="serv-chip'+(mode==="new"?" on":"")+'" data-servmode="new">+ Create serving</button>';
    html+='</div>';
    if(mode==="unit"&&units[selIdx]){
      var u=units[selIdx];
      html+='<div class="serv-qty-row"><label>Quantity</label><input id="ml-serv-qty" type="text" inputmode="decimal" value="'+qty+'"><span class="serv-qty-total">'+fmt1(u.grams)+'g each \u00b7 = '+fmt1(qty*u.grams)+'g total</span></div>';
    }
    if(mode==="new"){
      var prefill=hint?parseServingGrams(hint):null;
      html+='<div class="serv-new-row"><input id="ml-serv-name" type="text" placeholder="Serving name, e.g. Rice cake"><input id="ml-serv-grams" type="text" inputmode="decimal" placeholder="grams per 1"'+(prefill!=null?(' value="'+prefill+'"'):'')+'><button type="button" class="linkbtn" id="ml-serv-save">Save serving</button></div>';
    }
    return html;
  }
  function servingGramsFor(identity){
    if(state.mlServMode!=="unit")return null;
    var units=loadServingUnits(identity),u=units[state.mlServSelIdx];
    if(!u)return null;

  }
  function rerenderOffServingBlock(){

  /* ===== VERBATIM: confirm card + barcode lookup flow ===== */
  function renderScanConfirm(info){
    var box=$("#ml-scan-result");if(!box)return;
    state.mlScanInfo=info;
    resetServingState();
    var identity=offIdentity(info.barcode);
    var favOn=isOffFav(info.barcode);
    box.innerHTML='<div class="ml-scan-confirm">'
      +'<div class="msc-name">'+esc(info.name||"Unnamed product")+'</div>'
      +(info.brand?'<div class="msc-brand">'+esc(info.brand)+'</div>':'')
      +'<div class="msc-macros">'+Math.round(info.kcal)+' kcal \u00b7 '+fmt1(info.protein)+'P \u00b7 '+fmt1(info.carbs)+'C \u00b7 '+fmt1(info.fat)+'F <span class="msc-per">per 100g</span></div>'
      +'<div class="msc-source">Source: Open Food Facts \u00b7 barcode '+esc(info.barcode)+'</div>'
      +'<button type="button" class="fav-toggle'+(favOn?' on':'')+'" id="ml-off-favtoggle" style="margin-top:8px">'+(favOn?'\u2605 Favourited':'\u2606 Save to Favourites')+'</button>'
      +'<div id="ml-offserv-block">'+servingBlockHTML(identity,info.serving||null)+'</div>'
      +'<div class="pmeal-grid" style="margin-top:10px"><div class="pmeal"><label>Grams</label><input id="ml-scan-grams" type="text" inputmode="decimal" placeholder="g"></div><div class="pmeal"></div></div>'
      +'<button type="button" class="cta" id="ml-scan-add" style="margin-top:10px">Add to meal</button>'
      +'<div class="saved-note" id="ml-scan-saved"></div>'
      +'</div>';
  }
  function doBarcodeLookup(barcode){
    barcode=String(barcode||"").trim().replace(/\D/g,"");
    if(!barcode){renderScanMsg("Enter a barcode number first.");return;}
    if(state.mlScanLoading)return;
    var now=Date.now();
    if(state.mlLastOffCall&&(now-state.mlLastOffCall)<OFF_MIN_INTERVAL_MS)return;
    state.mlLastOffCall=now;state.mlScanLoading=true;
    var btn=$("#ml-scan-lookup");if(btn)btn.disabled=true;
    renderScanMsg("Looking up\u2026");
    offFetchProduct(barcode).then(function(data){
      var info=offParseProduct(data,barcode);
      if(!info.found){renderScanNotFound("Product not found.");return;}
      if(!info.complete){renderScanNotFound("Nutrition information incomplete for this product.");return;}
      renderScanConfirm(info);
    }).catch(function(){
      renderScanNotFound("Could not reach Open Food Facts. Check your connection and try again.");
    }).then(function(){
      state.mlScanLoading=false;
      var b=$("#ml-scan-lookup");if(b)b.disabled=false;
    });
  }

  /* ===== ADAPTED: addScanItem. The item object is built exactly as in BFL; instead of
     writing into BFL's meal log (loadMealDay/saveMealDay + BFL-only re-renders) it is
     handed to cfg.onAdd so BFL FOOD decides where to store it. "meal" is left for the host. */
  function addScanItem(){
    var info=state.mlScanInfo;if(!info)return;
    var g=num($("#ml-scan-grams").value);
    if(g==null||g<=0){flash("#ml-scan-saved","Enter the grams first");return;}
    var si={id:String(Date.now())+Math.round(Math.random()*999),meal:state.mlMeal||null,custom:true,offSource:true,
      name:info.name+(info.brand?" ("+info.brand+")":""),grams:g,
      macros:{kcal:info.kcal*g/100,p:info.protein*g/100,c:info.carbs*g/100,f:info.fat*g/100,fib:(info.fib!=null?info.fib*g/100:0)},
      notes:"Open Food Facts · barcode "+info.barcode};
    if(state.mlServMode==="unit"){
      var su=loadServingUnits(offIdentity(info.barcode))[state.mlServSelIdx];
      if(su){si.servingName=su.name;si.servingQty=state.mlServQty||1;si.servingGrams=su.grams;}
    }
    if(typeof cfg.onAdd==="function")cfg.onAdd(si);
    flash("#ml-scan-saved","Added");
  }

  /* ===== VERBATIM: camera scanning (BarcodeDetector, feature-detected) ===== */
  /* ---------- optional camera-assisted scan (progressive enhancement, feature-detected) ---------- */
  function offCameraSupported(){return !!(window.BarcodeDetector&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);}
  function stopBarcodeCamera(){
    if(state.mlScanStream){state.mlScanStream.getTracks().forEach(function(t){t.stop();});state.mlScanStream=null;}
    if(state.mlScanRAF){cancelAnimationFrame(state.mlScanRAF);state.mlScanRAF=null;}
    var v=$("#ml-scan-video"),cb=$("#ml-scan-cam"),xb=$("#ml-scan-cam-cancel");
    if(v){v.style.display="none";v.srcObject=null;}
    if(cb)cb.style.display="";
    if(xb)xb.style.display="none";
  }
  function startBarcodeCamera(){
    if(!offCameraSupported())return;
    var v=$("#ml-scan-video"),cb=$("#ml-scan-cam"),xb=$("#ml-scan-cam-cancel");
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(stream){
      state.mlScanStream=stream;
      if(v){v.srcObject=stream;v.style.display="block";v.play();}
      if(cb)cb.style.display="none";
      if(xb)xb.style.display="";
      var detector=new window.BarcodeDetector();
      var found=false;
      function tick(){
        if(found||!state.mlScanStream)return;
        detector.detect(v).then(function(codes){
          if(found||!codes||!codes.length)return;
          found=true;
          var code=codes[0].rawValue;
          stopBarcodeCamera();
          var bi=$("#ml-barcode");if(bi){bi.value=code;state.mlBarcodeQuery=code;}
          doBarcodeLookup(code);
        }).catch(function(){});
        if(!found)state.mlScanRAF=requestAnimationFrame(tick);
      }
      state.mlScanRAF=requestAnimationFrame(tick);
    }).catch(function(){
      renderScanMsg("Could not access the camera. Enter the barcode number instead.");
    });
  }

      +(offCameraSupported()?'<button type="button" class="linkbtn" id="ml-scan-cam" style="margin-top:6px">📷 Scan with camera</button><button type="button" class="linkbtn" id="ml-scan-cam-cancel" style="margin-top:6px;display:none">Cancel camera</button>':'')

  /* ===== ADAPTED: event wiring — the scan/search/serving branches of BFL's #food
     click/input/keydown listeners, attached to the mount container instead. ===== */
  function wire(el){
    el.addEventListener("click",function(e){
      var ofp=e.target.closest("[data-offfavpick]");if(ofp){var fav=loadOffFav()[+ofp.getAttribute("data-offfavpick")];if(fav){renderScanConfirm({found:true,complete:true,barcode:fav.barcode,name:fav.name,brand:fav.brand,serving:null,kcal:fav.kcal,protein:fav.protein,carbs:fav.carbs,fat:fav.fat,fib:fav.fib});}return;}
      var sp=e.target.closest("[data-searchpick]");if(sp){var r=(state.mlSearchCache||[])[+sp.getAttribute("data-searchpick")];if(r&&typeof cfg.onFoodPick==="function"){var v=r.d.s[r.state];cfg.onFoodPick({kind:"db",key:r.d.k,name:r.d.name,state:r.state,grams:r.d.defg||null,per100g:{kcal:v[0],p:v[1],c:v[2],f:v[3],fib:v[4]},serv:r.d.serv||null,cat:r.d.cat});}return;}
      var oft=e.target.closest("#ml-off-favtoggle");if(oft){if(state.mlScanInfo){toggleOffFav(state.mlScanInfo);var nowFav=isOffFav(state.mlScanInfo.barcode);oft.textContent=nowFav?"★ Favourited":"☆ Save to Favourites";oft.classList.toggle("on",nowFav);}return;}
      var sl=e.target.closest("#ml-scan-lookup");if(sl){var bc=$("#ml-barcode");doBarcodeLookup(bc?bc.value:"");return;}
      var sc=e.target.closest("#ml-scan-cam");if(sc){startBarcodeCamera();return;}
      var scc=e.target.closest("#ml-scan-cam-cancel");if(scc){stopBarcodeCamera();return;}
      var sa=e.target.closest("#ml-scan-add");if(sa){addScanItem();return;}
      var sm=e.target.closest("#ml-scan-manual");if(sm){if(typeof cfg.onManual==="function")cfg.onManual();return;}
      var svm=e.target.closest("[data-servmode]");
      if(svm){
        var mode=svm.getAttribute("data-servmode");
        if(mode==="unit"){state.mlServMode="unit";state.mlServSelIdx=+svm.getAttribute("data-servidx");state.mlServQty=state.mlServQty||1;}
        else{state.mlServMode=mode;}
        if(state.mlScanInfo)rerenderOffServingBlock();
        return;
      }
      var svs=e.target.closest("#ml-serv-save");

function applyTheme(){
  var c=themeChoice(),sys=HOST_THEME==="dark"||(HOST_THEME!=="light"&&!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches));
  var v=c==="mint"||c==="barbie"?c:(c==="dark"||(c==="system"&&sys))?"dark":"light";document.documentElement.setAttribute("data-app-theme",v);

/* ============================== spoons ============================== */
/* 1 tsp = 5 ml, 1 tbsp = 15 ml (3 tsp). For foods measured in ml that is exact.
   For foods in grams, grams per level tablespoon come from USDA FoodData Central standard portions
   (honey 21 g, olive oil 13,5 g, butter 14,2 g, mayonnaise 13,8 g, ghee 12,8 g), or from your own
   weighing, saved per food in bflfood_spoons. Nothing else is guessed. */
K.spoons="bflfood_spoons";
var SPOON_STD={honey:21,olive_oil:13.5,butter:14.2,mayo:13.8,ghee:12.8};
var SPOONS=[["½ tsp",1/6],["1 tsp",1/3],["½ tbsp",0.5],["1 tbsp",1],["2 tbsp",2]];
function tbspOf(food){
  if(!food)return null;if(food.unit==="ml")return {g:15,src:"ml"};
  var own=DB.get(K.spoons,{})[itemRef(food)];if(own)return {g:own,src:"own"};
  if(food.src==="db"&&SPOON_STD[food.ref])return {g:SPOON_STD[food.ref],src:"std",std:"USDA standard portion: 1 tbsp = "+fmtN(SPOON_STD[food.ref])+" g."};
  if(food.src==="db"&&typeof CAT_TBSP!=="undefined"&&CAT_TBSP[food.ref])return {g:CAT_TBSP[food.ref].g,src:"std",std:"USDA household weight: NDB "+CAT_TBSP[food.ref].src+"."};
  return null;
}
function half(n){return Math.round(n*2)/2;}
function spoonEq(food,qty){
  var tb=tbspOf(food);if(!tb||!(qty>0))return "";
  var tsp=qty/(tb.g/3);if(tsp<0.4||tsp>24)return "";
  return tsp>=3?"≈ "+fmtN(half(qty/tb.g))+" tbsp":"≈ "+fmtN(half(tsp))+" tsp";
}
function spoonHTML(s){
  var food=s.food,tb=tbspOf(food),h='';
  if(tb){
    h+='<div><p class="eyebrow" style="margin-bottom:8px">Spoons'+(tb.src==="std"?' · standard weights':tb.src==="own"?' · your weight':'')+'</p><div class="chips">'
      +SPOONS.map(function(x){var q=r1(tb.g*x[1]);return '<button type="button" class="chip'+(s.spoon===x[0]?' on':'')+'" data-q="'+q+'" data-spoon="'+x[0]+'">'+x[0]+' · '+fmtN(q)+' '+food.unit+'</button>';}).join('')+'</div>'
      +(tb.src!=="ml"?'<button type="button" class="linkbtn" data-act="spoon-edit">'+(tb.src==="std"?'Use my own tablespoon weight':'Change tablespoon weight')+'</button>':'')+'</div>';
  } else if(food.unit==="g"&&food.src!=="drink")h+='<button type="button" class="linkbtn" data-act="spoon-edit" style="align-self:flex-start">Measure in teaspoons or tablespoons</button>';
  if(s.spoonEdit&&food.unit==="g"){var cur=tb&&tb.src!=="ml"?tb.g:"";
    h+='<div class="note"><label class="lbl" for="sp-g">1 level tablespoon of '+esc(food.name)+' weighs</label><div class="grid2"><div class="portion-amt"><input class="inp" id="sp-g" inputmode="decimal" value="'+(cur!==""?fmtN(cur):"")+'" style="width:100%;font-size:22px;min-height:52px"><span>g</span></div><button type="button" class="btn-main" data-act="spoon-save" style="min-height:52px;font-size:17px">Save</button></div><p class="muted small" style="margin-top:8px">Weigh one level tablespoon once, or copy it from the package. A teaspoon is a third of it.</p></div>';}
  return h;
}
/* ============================== SELECTED DATE ============================== */
/* Today shows APP.day (the selected calendar date, local time). It starts on today each time the app opens.
   Everything on Today (log, totals, creatine, edits) uses this date. Diary storage is unchanged: bflfood_diary[date]. */
function selDay(){var t=todayISO();if(!APP.day||APP.day>t)APP.day=t;return APP.day;}
function isSelToday(){return selDay()===todayISO();}
function dayLabel(day){var t=todayISO(),y=parseISO(t);y.setDate(y.getDate()-1);var d=parseISO(day);return day===t?"Today":day===isoOf(y)?"Yesterday":d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}).replace(",","");}
function dayLong(day){var d=parseISO(day);return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}).replace(",","");}
function goDay(day){var t=todayISO();APP.day=day>t?t:day;APP.dayConfirm=false;render();try{window.scrollTo(0,0);}catch(e){}}
/* targets for a date: the target saved on that date if there is one; otherwise today's settings, labelled as an estimate */
function targetsForDay(day,f){
  var R=calcFuel(f,day);if(day===todayISO()){R.tsrc="current";return R;}
  var h=targetFor(day),o=Object.assign({},R);
  if(h){o.kcal=h.kcal;o.protein=h.p;o.carbs=h.c;o.fat=h.f;o.tsrc="saved";o.tlabel=h.label||"";o.phase=null;}
  else{o.tsrc="estimate";o.phase=null;}
  return o;
}
function addToDay(food,qty,slot,spoon){
  var D=loadDiary(),day=selDay(),past=day!==todayISO();
  var e={id:uid(),slot:slot,name:food.name+(food.brand?" ("+food.brand+")":""),items:[quickItem(food,qty)],factor:1,src:"quick",at:past?null:Date.now()};
  if(past){e.loggedAt=Date.now();e.backfilled=true;}
  if(food.unit==="ml")e.drink=true;
  if(spoon)e.spoon=spoon;
  (D[day]=D[day]||[]).push(e);DB.set(K.diary,D);setUi({lastSlot:slot});return e;
}
function removeEntry(id){var D=loadDiary(),day=selDay();D[day]=(D[day]||[]).filter(function(e){return e.id!==id;});DB.set(K.diary,D);if(!D[day].length&&(dayStatusAll()[day]||{}).complete)setComplete(day,false);}
function findEntry(id){return (loadDiary()[selDay()]||[]).filter(function(e){return e.id===id;})[0];}
function recentItems(){
  var D=loadDiary(),all=[];
  Object.keys(D).forEach(function(k){(D[k]||[]).forEach(function(e){if(e.items&&e.items.length===1)all.push(e);});});
  all.sort(function(a,b){return (b.at||0)-(a.at||0);});
  var seen={},out=[];
  all.forEach(function(e){var it=e.items[0],ref=itemRef(it);if(seen[ref]||out.length>=6)return;seen[ref]=1;var f=clone(it);delete f.qty;delete f.uid;out.push({food:f,qty:r1(it.qty*(e.factor||1)),spoon:e.spoon||null});});
  return out;
}
function shortName(n){n=String(n).replace(/\s*\(.*?\)\s*/g," ").trim();return n.length>22?n.slice(0,21)+"…":n;}

/* ============================== CREATINE ============================== */
/* One record per local calendar date in bflfood_creatine: {"YYYY-MM-DD":{g:6,at:…}}. Unchecking removes that date only.
   Not food: never counted in calories, macros or fluids. */
K.creatine="bflfood_creatine";var CREATINE_G=6;
function creatineAll(){var c=DB.get(K.creatine,{});return c&&typeof c==="object"&&!Array.isArray(c)?c:{};}
function creatineTaken(day){return !!creatineAll()[day];}
function setCreatine(day,on){var c=creatineAll();if(on)c[day]={g:CREATINE_G,at:Date.now()};else delete c[day];DB.set(K.creatine,c);}
function crDay(){return selDay();}
function creatineHTML(){
  var day=crDay(),t=todayISO(),on=creatineTaken(day),isT=day===t,d=parseISO(day);
  var y=parseISO(t);y.setDate(y.getDate()-1);
  var lbl=isT?"Today":day===isoOf(y)?"Yesterday":d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}).replace(",","");
  return '<div class="cr" id="creatine"><div class="cr-top"><div><p class="cr-t">Creatine</p><p class="cr-s">Daily dose · '+CREATINE_G+' g</p></div>'
    +'</div>'
    +'<label class="cr-check'+(on?' on':'')+'"><input type="checkbox" id="cr-check"'+(on?' checked':'')+'><span class="cr-box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Taken '+(isT?'today':'this day')+'</span></label>'
    +(on?'<p class="cr-ok" role="status">'+CREATINE_G+' g logged for '+(isT?'today':esc(lbl==="Yesterday"?"yesterday":lbl))+'</p>':'')+'</div>';
}

function logHTML(day){

K.signals="bflfood_signals";

function sgLabel(list,v){var r=list.filter(function(x){return x[0]===v;})[0];return r?r[1]:"";}

function localStamp(d){d=d||new Date();return isoOf(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function sgWhen(at){if(!at)return "No date";var d=new Date(at);if(isNaN(d))return String(at);return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}).replace(",","")+" · "+String(d.getHours()).padStart(2,"0")+"."+String(d.getMinutes()).padStart(2,"0");}
function sgBlank(){return {id:null,at:localStamp(),what:"",sym:[],symNote:"",how:null,howNote:"",feel:null,why:[],worth:null,inIt:"",dec:null,symAt:"",lasted:"",amount:"",others:"",ctx:[],ctxNote:"",from:null};}
function sgRealSym(e){return (e.sym||[]).filter(function(x){return x!=="None noticed";});}
function sgFilled(d){return !!(String(d.what||"").trim()||(d.sym||[]).length||d.symNote.trim()||d.how||d.howNote.trim()||d.feel||(d.why||[]).length||d.worth||d.inIt.trim()||d.dec||d.symAt.trim()||d.lasted.trim()||d.amount.trim()||d.others.trim()||(d.ctx||[]).length||d.ctxNote.trim());}
/* answers you use most come first; your own answers are remembered from earlier entries */
function sgRanked(base,field){
  var cnt={},order=base.slice();
  loadSignals().forEach(function(e){(e[field]||[]).forEach(function(v){cnt[v]=(cnt[v]||0)+1;if(order.indexOf(v)<0)order.push(v);});});
  return order.map(function(v,i){return [v,cnt[v]||0,i];}).sort(function(a,b){return b[1]-a[1]||a[2]-b[2];}).map(function(x){return x[0];});
}
function sgWhatSuggest(){
  var out=[],seen={};
  (loadDiary()[todayISO()]||[]).slice().reverse().forEach(function(e){var k=norm(e.name);if(!seen[k]&&out.length<4){seen[k]=1;out.push({name:e.name,entry:e.id});}});
  var cnt={},name={};loadSignals().forEach(function(e){var k=norm(String(e.what||"").trim());if(!k)return;cnt[k]=(cnt[k]||0)+1;name[k]=e.what.trim();});
  Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).forEach(function(k){if(!seen[k]&&out.length<8){seen[k]=1;out.push({name:name[k]});}});
  return out;
}

  var hits=r.hits.filter(function(x){return x.level==="allergy";});
  return hits.map(function(x){return '<div class="note alert">⚠ Confirmed allergy: '+esc(x.c.name)+'. '+esc(x.reasons[0])+'</div>';}).join('');
}

    +'<div class="grid2"><div><label class="lbl">Symptoms began</label>'+sgInp("symAt",d.symAt,"e.g. 30 min after","When did symptoms begin")+'</div><div><label class="lbl">Lasted</label>'+sgInp("lasted",d.lasted,"e.g. 3 hours","How long did they last")+'</div></div>'

    +'<div><p class="lbl">Context</p>'+sgChips("ctx",sgRanked(SG_CTX,"ctx"),d.ctx,true)+'</div>'

  if(d.id)h+=(s.confirm?'<div class="note warn">Delete this entry? <div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn-danger" data-sga="del-yes">Delete</button><button type="button" class="btn-line" data-sga="del-no">Keep</button></div></div>':'<button type="button" class="btn-danger" data-sga="del" style="width:100%">Delete</button>');

function openSignal(d,from){APP.sheet={view:"signal",d:d,from:from||null};renderSheet();}
function signalFromEntry(e,day){
  var d=sgBlank();d.what=e.name;
  if(e.at){var dt=new Date(e.at);if(isoOf(dt)===day)d.at=localStamp(dt);else d.at=day+"T12:00";}else d.at=day+"T12:00";
  if(e.items&&e.items.length===1){var it=e.items[0];d.amount=(e.spoon?e.spoon+" · ":"")+fmtN(r1(it.qty*(e.factor||1)))+" "+it.unit;}

/* ----- history ----- */
function sgMatch(e,q,f){
  if(f==="liked"&&e.feel!=="liked")return false;if(f==="disliked"&&e.feel!=="disliked")return false;
  if(f==="sym"&&!sgRealSym(e).length)return false;if((f==="in"||f==="watch"||f==="out")&&e.dec!==f)return false;
  if(!q)return true;var t=norm([e.what,(e.sym||[]).join(" "),e.symNote,e.howNote,(e.why||[]).join(" "),e.inIt,e.others,e.ctxNote].join(" "));
  return norm(q).split(/\s+/).every(function(w){return t.indexOf(w)>=0;});
}
function sgSorted(){return loadSignals().slice().sort(function(a,b){return String(b.at||"")<String(a.at||"")?-1:String(b.at||"")>String(a.at||"")?1:(b.created||0)-(a.created||0);});}
function sgSymTxt(e){var s=(e.sym||[]).join(", ");if(e.symNote)s+=(s?" — ":"")+e.symNote;return s;}

/* ----- patterns (counts only — never causation) ----- */
function sgSplitIngr(t){return String(t||"").split(/[,;\n\/]+| og | and /i).map(function(x){return x.trim().replace(/\.$/,"");}).filter(function(x){return x.length>1&&x.length<40;});}
function sgPatterns(){
  var A=loadSignals(),P={n:A.length,ready:A.length>=SG_MIN,foodsSym:[],sym:[],liked:[],why:[],ingr:[]};
  var food={},sym={},why={},ingr={};
  A.forEach(function(e){
    var k=norm(String(e.what||"").trim()),rs=sgRealSym(e),bad=rs.length>0||e.feel==="disliked";
    if(k){var f=food[k]=food[k]||{name:String(e.what).trim(),n:0,bad:0,liked:0};f.n++;if(bad)f.bad++;if(e.feel==="liked")f.liked++;}
    rs.forEach(function(s){sym[s]=(sym[s]||0)+1;});
    (e.why||[]).forEach(function(w){var x=why[w]=why[w]||{n:0,no:0};x.n++;if(e.worth==="no")x.no++;});
    if(bad){var seen={};sgSplitIngr(e.inIt).forEach(function(i){var ki=norm(i);if(seen[ki])return;seen[ki]=1;var x=ingr[ki]=ingr[ki]||{name:i,n:0};x.n++;});}
  });
  Object.keys(food).forEach(function(k){var f=food[k];if(f.bad>=2)P.foodsSym.push(f);if(f.liked>=2)P.liked.push(f);});
  P.foodsSym.sort(function(a,b){return b.bad-a.bad;});P.liked.sort(function(a,b){return b.liked-a.liked;});
  P.sym=Object.keys(sym).map(function(s){return {name:s,n:sym[s]};}).filter(function(x){return x.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,6);
  P.why=Object.keys(why).map(function(w){return {name:w,n:why[w].n,no:why[w].no};}).filter(function(x){return x.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,6);
  P.ingr=Object.keys(ingr).map(function(k){return ingr[k];}).filter(function(x){return x.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,8);
  return P;
}

  else{
    var sec=function(title,list,fn){return list.length?'<div><p class="lbl">'+title+'</p><ul class="sg-pat">'+list.map(function(x){return '<li>'+fn(x)+'</li>';}).join('')+'</ul></div>':'';};
    b+=sec("Foods often noted with symptoms",P.foodsSym,function(f){return '<b>'+esc(f.name)+'</b> · symptoms or disliked in '+f.bad+' of '+f.n+' entries <span class="cnt">'+obs(f.bad)+'</span>';});

    b+=sec("Foods your body liked",P.liked,function(f){return '<b>'+esc(f.name)+'</b> · liked in '+f.liked+' of '+f.n+' entries <span class="cnt">'+obs(f.liked)+'</span>';});
    b+=sec("Why you chose food",P.why,function(x){return '<b>'+esc(x.name)+'</b>'+(x.no?' · not worth it '+x.no+' time'+(x.no===1?'':'s'):'')+' <span class="cnt">'+obs(x.n)+'</span>';});

/* ============================== MORNING BODY CHECK ============================== */
/* "How do I feel today?" — under a minute. Saved in bflfood_mornings, with or without a linked food.
   A linked food is your own suspected association, never a cause. Nothing is linked automatically.
   No streaks: skipped days are simply not counted. */
K.mornings="bflfood_mornings";
var MC_SYM=["Heavy body / sluggish","Poor sleep","Nausea","Headache / migraine","Runny nose","Mucus / congestion","Stomach pain","Bloating","Constipation","Fatigue","Skin symptoms"];
var MC_GOOD="Feeling good / no symptoms";
var MC_SEV=[["mild","Mild"],["moderate","Moderate"],["severe","Severe"]];
var MC_SLEEP=[["good","Good"],["ok","OK"],["poor","Poor"]];
var MC_STRESS=[["low","Low"],["medium","Medium"],["high","High"]];
var MC_AFT=[["yes","Yes"],["no","No"]];
var MC_CYCLE=["Period","Days before period","Mid-cycle","Not relevant"];
var MC_ILL=["Cold / feeling ill","Hay fever / allergy symptoms"];
var MC_RANGES=[["28","4 weeks"],["91","3 months"],["365","12 months"],["all","All"]];
function loadMornings(){var a=DB.get(K.mornings,[]);return Array.isArray(a)?a:[];}

function mcBlank(){return {id:null,at:localStamp(),sym:[],good:false,sleep:null,onset:"",afternoon:null,cycle:null,stress:null,ill:[],illNote:"",note:"",links:[]};}
function mcReal(m){return (m.sym||[]);}
function mcFilled(d){return !!(d.sym.length||d.good||d.sleep||d.onset.trim()||d.afternoon||d.cycle||d.stress||d.ill.length||d.illNote.trim()||d.note.trim()||d.links.length);}
function mcSymNames(){var order=MC_SYM.slice(),cnt={};loadMornings().forEach(function(m){(m.sym||[]).forEach(function(s){cnt[s.name]=(cnt[s.name]||0)+1;if(order.indexOf(s.name)<0)order.push(s.name);});});return order;}
function mcSymTxt(m){if(m.good)return MC_GOOD;return (m.sym||[]).map(function(s){return s.name+(s.sev?" ("+sgLabel(MC_SEV,s.sev).toLowerCase()+")":"");}).join(", ");}
/* foods logged in the 48 hours before the check (diary + Food Detective entries) */
function mcRecentFoods(at){
  var end=new Date(at).getTime();if(isNaN(end))end=Date.now();var start=end-48*3600000,out=[],D=loadDiary();
  Object.keys(D).forEach(function(day){(D[day]||[]).forEach(function(e){var t=e.at||new Date(day+"T12:00").getTime();if(t>=start&&t<=end)out.push({key:"d:"+e.id,src:"diary",id:e.id,day:day,name:e.name,t:t});});});
  loadSignals().forEach(function(e){if(!String(e.what||"").trim())return;var t=new Date(e.at).getTime();if(!isNaN(t)&&t>=start&&t<=end&&!(e.from&&out.some(function(o){return o.id===e.from.id;})))out.push({key:"s:"+e.id,src:"signal",id:e.id,day:String(e.at).slice(0,10),name:e.what.trim(),t:t});});
  return out.sort(function(a,b){return b.t-a.t;});
}

function wAvg(from,to){var P=loadProg().filter(function(e){return e.weight!=null&&e.date>=from&&e.date<=to;});var by={};P.forEach(function(e){by[e.date]=e.weight;});var v=Object.keys(by).map(function(k){return by[k];});return {n:v.length,avg:v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null};}
function scaleAvg(key,days){var v=days.map(function(d){return dayCtx(d)[key];}).filter(function(x){return x!=null;});return {n:v.length,avg:v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null};}
function cuttingData(){
  var t=todayISO(),cur=wAvg(dayAdd(t,-6),t),prev=wAvg(dayAdd(t,-13),dayAdd(t,-7)),o={cur:cur,prev:prev};
  var W=loadProg().filter(function(e){return e.weight!=null;}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});o.latest=W[0]||null;
  if(cur.n>=3&&prev.n>=3){o.kg=cur.avg-prev.avg;o.pct=o.kg/prev.avg*100;}
  /* stable over multiple weeks: three consecutive 7-day averages, each with ≥3 weigh-ins, within ±0,2% of each other */
  var w3=wAvg(dayAdd(t,-20),dayAdd(t,-14));o.w3=w3;
  if(o.pct!=null&&w3.n>=3){var p2=(prev.avg-w3.avg)/w3.avg*100;o.stableWeeks=Math.abs(o.pct)<=0.2&&Math.abs(p2)<=0.2;}
  else if(o.pct!=null)o.stableShort=Math.abs(o.pct)<=0.2;
  o.c7=biConsistency(7);var d7=lastDays(7),d14=lastDays(14).slice(0,7);
  ["energy","recovery","performance","hunger"].forEach(function(k){o[k]={cur:scaleAvg(k,d7),prev:scaleAvg(k,d14)};});
  var M=loadMornings().filter(function(m){return String(m.at).slice(0,10)>=d7[0];}),sym={};
  M.forEach(function(m){(m.sym||[]).forEach(function(s){sym[s.name]=(sym[s.name]||0)+1;});});
  loadSignals().filter(function(s){return String(s.at).slice(0,10)>=d7[0];}).forEach(function(s){sgRealSym(s).forEach(function(x){sym[x]=(sym[x]||0)+1;});});
  o.sym=sym;o.poorSleep=d7.filter(function(d){return daySleep(d)==="poor";}).length;o.sleepKnown=d7.filter(function(d){return daySleep(d);}).length;
  return o;
}
function sgn2(v){var a=Math.abs(v).toFixed(2).replace(".",",");return (Math.abs(v)<0.005?"±":v>0?"+":"−")+a;}
function trendTxt(x){if(x.cur.n<2||x.prev.n<2)return "Not enough data";var d=x.cur.avg-x.prev.avg;return fmt1(x.cur.avg)+" this week vs "+fmt1(x.prev.avg)+" last week"+(Math.abs(d)<0.3?" (about the same)":d>0?" (higher)":" (lower)");}
function cuttingHTML(){
  var o=cuttingData(),R=calcFuel(loadFuel()),N=loadNutr(),c7=o.c7,msgs=[];
  var rows=[["Current weight",o.latest?fmtN(o.latest.weight)+" kg · "+dShort(o.latest.date):"Not enough data"],
    ["7-day average",o.cur.n>=3?fmtN(r1(o.cur.avg))+" kg ("+o.cur.n+" weigh-ins)":"Not enough data"],
    ["Previous 7-day average",o.prev.n>=3?fmtN(r1(o.prev.avg))+" kg ("+o.prev.n+" weigh-ins)":"Not enough data"],

    ["Average calories",c7.enough?fmtK(c7.avg.kcal)+" kcal ("+c7.complete.length+" complete days)":"Not enough data"],
    ["Average protein",c7.enough?Math.round(c7.avg.p)+" g"+(R.protein!=null?" · target "+R.protein+" g":""):"Not enough data"],
    ["Training performance",trendTxt(o.performance)],["Energy",trendTxt(o.energy)],["Recovery",trendTxt(o.recovery)]];
  if(N.goal!=null&&o.cur.n>=3)rows.splice(3,0,["Goal weight",fmtN(N.goal)+" kg · "+fmtN(r1(Math.abs(o.cur.avg-N.goal)))+" kg "+(o.cur.avg>N.goal?"to go":"below goal")]);

  if(trainLow>=2)msgs.push("Your energy has been lower on "+trainLow+" recent training days. Review your recovery and food intake.");
  var worse=["energy","recovery","performance"].filter(function(k){var x=o[k];return x.cur.n>=2&&x.prev.n>=2&&x.cur.avg<=x.prev.avg-0.5;});
  if(worse.length&&R.phase&&R.phase.ok&&R.phase.mode!=="maintain")msgs.push("Your "+worse.join(" and ")+" ratings are lower than last week. Consider reviewing the cutting intensity, for example a gentler phase, rather than eating less.");

  var sk=Object.keys(o.sym).filter(function(k){return /nausea|headache|migraine|bloat|stomach|constipation|diarrh|gas|heartburn|reflux/i.test(k);});
  var F=reviewFlags(),T0=R.phase&&R.phase.ok?R.phase:null,cpk=T0&&N.weight?T0.baseC/N.weight:null;
  if(cpk!=null&&cpk<3&&(N.session.intensity==="hard"||(N.session.min!=null&&N.session.min>=75)))F.push({k:"carbs",t:"Your carbohydrate target ("+fmtN(r1(cpk))+" g/kg) is below the 3–7 g/kg range suggested for training, and your sessions are long or hard."});
  if(F.length&&T0&&T0.mode!=="maintain")msgs.unshift("Worth reviewing: "+F.map(function(x,i){var t=x.t.replace(/\.$/,"");return i?t.charAt(0).toLowerCase()+t.slice(1):t;}).join("; ")+". Consider your recovery, food intake and the cutting intensity before eating less.");
  else if(F.length)msgs.unshift("Worth reviewing: "+F.map(function(x,i){var t=x.t.replace(/\.$/,"");return i?t.charAt(0).toLowerCase()+t.slice(1):t;}).join("; ")+".");
  var h='<dl class="sg-dl cp-dl">'+rows.map(function(r){return '<div><dt>'+r[0]+'</dt><dd'+(r[1]==="Not enough data"?' class="muted"':'')+'>'+esc(r[1])+'</dd></div>';}).join('')+'</dl>';
  if(sk.length)h+='<p class="small">Noted this week: '+esc(sk.map(function(k){return k.toLowerCase()+" "+o.sym[k]+"×";}).join(", "))+' (morning checks and Food Detective).</p>';
  h+=femalePatternsHTML();
  h+=msgs.length?'<ul class="sg-pat">'+msgs.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>':'';
  h+='<p class="muted small">Weekly change = (this 7-day average − previous 7-day average) ÷ previous × 100. It needs at least 3 weigh-ins in each week. These are patterns in your records, not proven causes. Targets never change without your approval.</p>';
  return h;
}

  }

    else if(longAgo||hungry||low){g.preSnack=true;g.points.push(soon?"Training is coming up and "+(longAgo?"your last meal was more than 4 hours ago":hungry?"you’re hungry":"your energy is low")+". A small snack with carbohydrate and some protein can help.":"If you train within the next few hours, a small snack with carbohydrate and some protein can help, because "+(longAgo?"your last meal was more than 4 hours ago.":hungry?"you’re hungry.":"your energy is low."));}

/* read and check the form. Returns {rec} or {err}. Nothing is saved here. */
function pfCheck(s){
  var d=s.d,u=d.unit==="ml"?"ml":"g",err=[],per={};
  var name=String(d.name||"").trim();if(!name)err.push("Enter the product name.");
  PF_REQ.forEach(function(x){var raw=String(d[x[0]]||"").trim(),v=num(raw);
    if(raw===""){err.push("Enter "+x[1].toLowerCase()+" per 100 "+u+". Use 0 if the label says 0.");return;}
    if(v==null||v<0||v>x[3]){err.push(x[1]+" must be a number between 0 and "+x[3]+".");return;}per[x[0]]=v;});
  PF_OPT.forEach(function(x){var raw=String(d[x[0]]||"").trim(),v=num(raw);per[x[0]]=null;if(raw==="")return;
    if(v==null||v<0||v>x[3]){err.push(PF_PLAIN[x[0]]+" must be a number between 0 and "+x[3]+", or left empty.");return;}per[x[0]]=v;});
  if(per.asug!=null&&per.sug!=null&&per.asug>per.sug+0.05)err.push("Added sugars can’t be more than total sugars. Check the label.");
  if(per.asug!=null&&per.c!=null&&per.asug>per.c+0.05)err.push("Added sugars can’t be more than carbohydrates. Check the label.");
  if(per.sug!=null&&per.c!=null&&per.sug>per.c+0.05)err.push("Sugars can’t be more than carbohydrates. Check the label.");
  if(per.p!=null&&per.c!=null&&per.f!=null&&per.p+per.c+per.f+(per.fib||0)>100.5&&u==="g")err.push("Protein, carbs and fat add up to more than 100 g per 100 g. Check the label.");
  var bc=String(d.barcode||"").replace(/\s/g,"");
  if(bc&&!/^\d{6,14}$/.test(bc))err.push("The barcode should be 6–14 digits, or left empty.");
  var other=bc&&libAll().filter(function(x){return x.barcode&&String(x.barcode)===bc&&x.id!==s.id;})[0];
  if(other)err.push("Barcode "+bc+" is already saved as “"+other.name+"”. Edit that product instead.");
  var sv=String(d.serving||"").trim(),sg=num(sv),serving=null;
  if(sv!==""){if(sg==null||sg<=0||sg>5000)err.push("Serving size must be above 0, or left empty.");else serving={g:sg};}
  if(err.length)return {err:err};
  return {rec:{name:name,brand:String(d.brand||"").trim(),barcode:bc,unit:u,per100:per,serving:serving}};
}

    case "note-save":var nt=($("#n-text").value||"").trim();if(!nt){toast("Write something first");break;}var NS=loadNotes(),nw={id:uid(),text:nt,at:Date.now()};NS.push(nw);DB.set(K.notes,NS);setUi({noteDraft:""});render();toast("Note saved",function(){DB.set(K.notes,loadNotes().filter(function(x){return x.id!==nw.id;}));setUi({noteDraft:nt});render();toast("Removed");});break;
    case "note-upd":var ut=($("#ne-text").value||"").trim();if(!ut){toast("A note can't be empty. Use Delete instead.");break;}var NU=loadNotes();NU.forEach(function(x){if(x.id===s.id&&x.text!==ut){x.text=ut;x.edited=Date.now();}});DB.set(K.notes,NU);closeSheet();render();toast("Saved");break;
    case "note-del":s.text=$("#ne-text").value;s.confirm=true;renderSheet();break;
    case "note-del-no":s.text=$("#ne-text").value;s.confirm=false;renderSheet();break;
    case "note-del-yes":var ND=loadNotes(),gn=ND.filter(function(x){return x.id===s.id;})[0];DB.set(K.notes,ND.filter(function(x){return x.id!==s.id;}));closeSheet();render();toast("Note deleted",function(){var NR=loadNotes();NR.push(gn);DB.set(K.notes,NR);render();toast("Restored");});break;
    case "edit-del":s.confirm=true;renderSheet();break;
    case "edit-del-no":s.confirm=false;renderSheet();break;
    case "edit-del-yes":var gone=findEntry(s.id),gday=selDay();removeEntry(s.id);closeSheet();render();toast("Deleted",function(){var D2=loadDiary(),d2=gday;(D2[d2]=D2[d2]||[]).push(gone);DB.set(K.diary,D2);render();toast("Restored");});break;
    case "save-meas":
      var rm=readMeas();if(rm.err.length){$("#ms-err").innerHTML='<div class="note warn">'+rm.err.map(esc).join("<br>")+'</div>';break;}
      var f2=loadFuel();f2.meas=rm.m;f2.measSaved=todayISO();f2.migrated=false;saveFuel(f2);var oo=ui().open||{};oo["me-meas"]=false;setUi({open:oo});render();toast("Plan calculated");break;
    case "own-save":var f3=loadFuel(),ov=$("#own-kcal").value.trim(),ok=num(ov);if(ov!==""&&(ok==null||ok<800||ok>6000)){toast("Use a target between 800 and 6000 kcal");break;}f3.overBy[f3.strategy].kcal=ov===""?null:Math.round(ok);saveFuel(f3);render();toast(ov===""?"Using the recommended target":"Own target saved");break;
    case "reset-maint":var f4=loadFuel();f4.maintOverride=null;f4.maintOverrideDate=null;saveFuel(f4);render();toast("Back to the calculated maintenance");break;
    case "w-save":var wv=num($("#w-today").value);if(wv==null||wv<30||wv>300){toast("Enter a weight between 30 and 300 kg");break;}var P=loadProg();P.push({id:uid(),date:todayISO(),weight:wv,waist:null,strength:"",hunger:null,energy:null,sleep:null,recovery:null,cycle:"",note:""});DB.set(K.progress,P);render();toast("Weight saved");break;
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target,s=APP.sheet;
  if(t.id==="s-q"&&s){s.q=t.value;APP.bres="";$("#s-res").innerHTML=foodsListHTML(t.value,"s");return;}
  if(t.hasAttribute&&t.hasAttribute("data-pf")&&s&&s.d){s.d[t.getAttribute("data-pf")]=t.value;s.warned=false;return;}
  if(t.id==="qe-text"&&s){s.text=t.value;return;}
  if(t.id==="qe-name"&&s){s.name=t.value;return;}
  if(t.id==="qm-name"&&s&&s.mac){s.mac.name=t.value;return;}
  if(t.hasAttribute&&t.hasAttribute("data-qm")&&s&&s.mac){var qk=t.getAttribute("data-qm"),qv=num(t.value);s.mac.vals[qk]=qv==null||qv<0?null:qv;if(s.mac.calc[qk]){delete s.mac.calc[qk];}if(qv!=null&&s.mac.given.indexOf(qk)<0)s.mac.given.push(qk);t.classList.toggle("qm-miss",qv==null);qmRefresh();return;}
  if(t.hasAttribute&&t.hasAttribute("data-qeq")&&s&&s.items){var qi=+t.getAttribute("data-qeq"),qit=s.items[qi];if(qit){if(qit.food)qit.sq=t.value;else qit.words=t.value;var sr=$("#qe-sr-"+qi);if(sr)sr.innerHTML=qeSearchHTML(t.value,qi);}return;}
  if(t.hasAttribute&&t.hasAttribute("data-qeg")&&s&&s.items){var gi=+t.getAttribute("data-qeg"),git=s.items[gi],gv=num(t.value);if(git&&gv!=null&&gv>=0){git.g=gv;var us=qeUnitSize(git);if(us&&Math.abs(gv/us.g-Math.round(gv/us.g*2)/2)<1e-6){git.count=Math.round(gv/us.g*2)/2;}else{git.unit=git.food.unit;git.count=null;}git.conf=git.food.userEst?"user":"given";git.notes=["Amount set by you: "+fmtN(gv)+" "+git.food.unit+"."];var cn=$("#qe-cnt-"+gi);if(cn)cn.textContent=(qeUnitSize(git)&&git.count?fmtQ(git.count)+" "+qeUnitWord(git,git.count):"Amount");qeRefreshItem(gi);}return;}
  if(t.id==="f-q"){APP.fq=t.value;APP.bres="";$("#f-res").innerHTML=foodsListHTML(t.value,"f");return;}
  if(t.id==="n-text"){setUi({noteDraft:t.value});return;}
  if(t.id==="p-qty"&&s){s.qty=num(t.value);s.spoon=null;$("#p-res").innerHTML=resultHTML(s.food,s.qty);$("#p-eq").textContent=spoonEq(s.food,s.qty);document.querySelectorAll("[data-q]").forEach(function(b){b.classList.toggle("on",s.qty!=null&&r1(+b.getAttribute("data-q"))===r1(s.qty));});return;}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="cr-check"){setCreatine(crDay(),t.checked);render();return;}
  if(t.hasAttribute("data-cons")){var p=loadProfile(),id=t.getAttribute("data-cons");p.cons.forEach(function(c){if(c.id===id)c.status=t.value;});p.setup=true;saveProfile(p);toast("Food profile saved");return;}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&APP.sheet)closeSheet();
  if(ev.key==="Enter"&&(ev.target.id==="s-q"||ev.target.id==="f-q")){var d=String(ev.target.value).replace(/\s/g,"");if(/^\d{8,14}$/.test(d)){ev.preventDefault();lookupBarcode(d);}}
});

applyTheme();

APP.tab=["today","foods","signals","me"].indexOf(_t)>=0?_t:"today";
