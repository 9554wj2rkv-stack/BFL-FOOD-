<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-title" content="BFL Food">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Body Fuel Lab – Food Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  BFL FOOD — version 2, rebuilt from scratch on layout 4 ("Dark focus"), with Light / Dark / System.
  Three tabs: Today, Foods, Me. Data keys (bflfood_*) are the same as version 1, so logged food,
  your plan, food profile, favourites, own foods and weight check-ins carry over.
  The engine (calculations, food list, barcode lookup, safety checks) is copied unchanged.
-->
<style>
/* Layout 4: one calm column — a budget card, one big log button, repeat chips, today's log. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --raise:#F4F4F6; --line:#E2E2E6; --line-2:#C9C9D0;
  --ink:#0D0D0D; --ink-2:#36363A; --muted:#5A5A62; --track:#E6E6EA;
  --btn:#0D0D0D; --on-btn:#FFFFFF; --pill:#F1F1F3; --seg-on:#FFFFFF; --overlay:rgba(0,0,0,.42);
  --prot:#628EC8; --carb:#D99B50; --fat:#78A98A; --over:#C9572A; --ok:#2E7A60;
  --alert:#A3192F; --alert-bg:#FDE7EA; --warn:#6B4A0C; --warn-bg:#FBF0D9;
  --m-b:#E5C33A; --m-l:#6DBB86; --m-d:#7FA7EA; --m-s:#EE9670;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;
  color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#101010; --card:#101010; --raise:#1E1E21; --line:#2F2F33; --line-2:#48484E;
  --ink:#FFFFFF; --ink-2:#E0E0E4; --muted:#A8A8B0; --track:#38383D;
  --btn:#F2F2F2; --on-btn:#101010; --pill:#2A2A2E; --seg-on:#3A3A40; --overlay:rgba(0,0,0,.65);
  --over:#F0905E; --ok:#6CC39B;
  --alert:#FF8C9C; --alert-bg:#3A1A1F; --warn:#F3C46B; --warn-bg:#33280F;
  color-scheme:dark;
}
/* Mint and Barbie: the colours of the sister app, Body Fuel Lab */
:root[data-app-theme="mint"]{
  --bg:#A9E2BF; --card:#FFFFFF; --raise:#D6F2E2; --line:#86C3A0; --line-2:#4F8E6E;
  --ink:#11281E; --ink-2:#1B3329; --muted:#2F5444; --track:#D3ECDD;
  --btn:#147A5A; --on-btn:#FFFFFF; --pill:#E6F7EE; --seg-on:#FFFFFF; --overlay:rgba(10,40,25,.45);
  --ok:#147A5A; --accent:#147A5A;
}
:root[data-app-theme="barbie"]{
  --bg:#FFE6F2; --card:#FFFFFF; --raise:#FFD6EA; --line:#F6B3D3; --line-2:#D9739F;
  --ink:#3D0A24; --ink-2:#5E1838; --muted:#7E2A52; --track:#FFDCEE;
  --btn:#C2156F; --on-btn:#FFFFFF; --pill:#FFFFFF; --seg-on:#FFFFFF; --overlay:rgba(61,10,36,.45);
  --accent:#C2156F;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--prot);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
p{margin:0}
main{padding-block:26px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.page{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* shared */
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:16px}
.small{font-size:15px}
.pill{font-size:15px;font-weight:700;background:var(--pill);padding:6px 12px;border-radius:999px;white-space:nowrap}
.card{border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:18px;background:var(--card)}
.h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.head-date{font-size:17px;font-weight:700;color:var(--ink-2)}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:6px}
.big.over{color:var(--over)}
.mrow{display:flex;flex-direction:column;gap:8px}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.mrow-top .n{font-size:21px;font-weight:600}
.mrow-top .v{font-size:21px;font-weight:700;white-space:nowrap}
.mrow-top .v span{color:var(--muted);font-weight:600}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;max-width:100%;transition:width .3s}
.bar.p i{background:var(--prot)} .bar.c i{background:var(--carb)} .bar.f i{background:var(--fat)} .bar i.over{background:var(--over)}
.fluids{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.fluids b{color:var(--ink);font-size:19px}
.btn-main{border:0;background:var(--btn);color:var(--on-btn);border-radius:999px;min-height:60px;width:100%;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px}
.btn-main:active{transform:scale(.985)}
.btn-main:disabled{opacity:.45}
.btn-line{border:1.5px solid var(--line-2);background:transparent;color:var(--ink);border-radius:999px;min-height:48px;padding:0 18px;font-size:17px;font-weight:600}
.btn-danger{border:1.5px solid var(--alert);background:transparent;color:var(--alert);border-radius:999px;min-height:48px;padding:0 18px;font-size:17px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:transparent;color:var(--ink);border-radius:999px;min-height:46px;padding:0 16px;font-size:16px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--raise);padding:4px;border-radius:16px}
.seg button{border:0;background:transparent;border-radius:12px;min-height:46px;font-size:16px;font-weight:700;color:var(--muted);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg button small{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button.on small{color:var(--ink-2)}
.note{border-radius:14px;padding:12px 14px;font-size:16px;background:var(--raise);color:var(--ink-2)}
.note.alert{background:var(--alert-bg);color:var(--alert);font-weight:600}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note button{margin-top:8px}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:3px;padding:8px 0;min-height:44px}

/* today's log */
.log{display:flex;flex-direction:column}
.log-h{display:flex;align-items:center;gap:10px;padding:16px 0 6px;font-size:18px;font-weight:700}
.log-h .k{margin-left:auto;font-size:16px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.Breakfast{background:var(--m-b)} .dot.Lunch{background:var(--m-l)} .dot.Dinner{background:var(--m-d)} .dot.Snacks{background:var(--m-s)}
.row{width:100%;display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:13px 0;min-height:58px;color:var(--ink)}
.row .n{flex:1;min-width:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.row .n small{display:block;font-size:15px;color:var(--muted);font-weight:500;margin-top:1px}
.row .k{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .k.mute{color:var(--muted);font-weight:600}
.row .warn-dot{width:10px;height:10px;border-radius:50%;background:var(--alert);flex:none}
.empty{color:var(--muted);font-size:17px;padding:8px 0}

/* forms */
label.lbl{display:block;font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;min-height:52px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:17px}
.inp::placeholder{color:var(--muted);opacity:1}
.inp:focus{outline:none;border-color:var(--ink)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 14px) 23px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:999px;background:var(--raise)}
.search input{border:0;background:transparent;flex:1;min-width:0;min-height:52px;font-size:18px;outline:none;color:var(--ink)}
.search svg{flex:none}
details.fold{border:1px solid var(--line);border-radius:18px}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;min-height:58px;font-size:18px;font-weight:700;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:22px;color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold .fold-b{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* reuse classes the engine's forms and explanations print */
.note.plain,.note.info{background:var(--raise);color:var(--ink-2)}
.note.caution{background:var(--warn-bg);color:var(--warn)}
.btn{border:1.5px solid var(--line-2);background:transparent;color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font-size:16px;font-weight:600}
.btn-primary{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.group-h{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:72px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
.nav button.on{color:var(--ink)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet-back{position:fixed;inset:0;background:var(--overlay);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:max(28px,env(safe-area-inset-top,0px));z-index:41;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;flex:1;font-size:20px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-body>.stack{max-width:520px;margin:0 auto}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slots button{min-height:46px;border-radius:14px;border:1.5px solid var(--line-2);background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:0 2px;display:flex;align-items:center;justify-content:center;gap:6px}
.slots button.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.res{display:flex;flex-direction:column}
.portion-amt{display:flex;align-items:center;gap:10px}
.portion-amt input{width:130px;text-align:center;font-size:28px;font-weight:800;min-height:62px}
.portion-amt span{font-size:20px;font-weight:700;color:var(--muted)}
.portion-amt .eq{font-size:18px;color:var(--ink-2)}
.result{display:flex;flex-direction:column;gap:4px}
.result p.big{margin:0;font-size:40px;color:var(--ink)}
.result p{font-size:17px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--btn);color:var(--on-btn);padding:10px 10px 10px 18px;border-radius:999px;font-weight:700;font-size:16px;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:up .2s ease}
.toast span{min-width:0}
.toast button{border:0;background:transparent;color:var(--on-btn);font-weight:800;text-decoration:underline;min-height:40px;padding:0 8px}
.toast.plain{padding-right:18px}
/* brand */
.brand{display:flex;align-items:center;gap:10px;margin-bottom:-6px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(155deg,#F23BA0,#C8137A);color:#fff;display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;flex:none;box-shadow:0 2px 6px rgba(200,19,122,.35)}
.brand-t{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;min-width:0}
.brand-t span{font-weight:600;color:var(--muted)}
/* appearance swatches */
.seg.themes button{gap:5px;min-height:62px;font-size:15px}
.sw{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
/* notes */
textarea.inp{min-height:150px;line-height:1.45;resize:vertical;font-size:18px;display:block}
.notes{display:flex;flex-direction:column;gap:10px}
.note-item{width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.note-item time{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
/* body signals */
.page.wide{max-width:520px}
@media (min-width:760px){.page.wide{max-width:1100px}}
.head-save{border:0;background:var(--btn);color:var(--on-btn);border-radius:999px;min-height:44px;padding:0 18px;font-size:17px;font-weight:800;flex:none}
.sgq{display:flex;flex-direction:column;gap:10px}
.sgq-h{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.sgq-h b{width:28px;height:28px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;font-size:15px;flex:none}
.sg-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.sg-add .btn-line{min-height:52px}
textarea.sg-ta{min-height:90px}
.sg-card{border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:10px}
.sg-card>summary{list-style:none;padding:14px 16px;min-height:64px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.sg-card>summary::-webkit-details-marker{display:none}
.sg-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px}
.sg-top b{overflow-wrap:anywhere}
.sg-sub{font-size:15px;color:var(--muted)}
.sg-card[open]>summary{border-bottom:1px solid var(--line)}
.sg-card .sg-dl,.sg-card>div{padding:0 16px}
.sg-card>div:last-child{padding-bottom:14px}
.sg-dl{margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.sg-dl div{display:grid;grid-template-columns:118px 1fr;gap:10px}
.sg-dl dt{font-size:15px;font-weight:700;color:var(--muted)}
.sg-dl dd{margin:0;font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
.sg-tag{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--pill);color:var(--ink);white-space:nowrap}
.sg-tag.out,.sg-tag.disliked{background:var(--alert-bg);color:var(--alert)}
.sg-tag.watch{background:var(--warn-bg);color:var(--warn)}
.sg-tag.in,.sg-tag.liked{background:var(--raise);color:var(--ok)}
.sg-table{display:none}
@media (min-width:760px){.sg-cards{display:none}.sg-table{display:block;overflow-x:auto}}
.sg-table table{width:100%;border-collapse:collapse;font-size:16px}
.sg-table th{text-align:left;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line-2)}
.sg-table td{vertical-align:top;padding:12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.sg-table td small{display:block;color:var(--muted);font-size:14px}
.sg-table .linkbtn{padding:0;min-height:0;text-align:left;font-size:17px}
/* my body intelligence */
.bi-card{padding:0;gap:0;overflow:hidden}
.bi-head{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:flex-start;gap:12px;text-align:left;padding:18px}
.bi-head>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bi-head b{font-size:20px;font-weight:800}
.bi-head small{font-size:15px;color:var(--muted)}
.bi-sum{font-size:16px;color:var(--ink-2);margin-top:6px;overflow-wrap:anywhere}
.bi-chev{flex:none;margin-top:4px;color:var(--muted)}.bi-chev.up{transform:rotate(180deg)}
.bi-card>details.fold{border:0;border-top:1px solid var(--line);border-radius:0}
.bi-card .fold-b{gap:14px}
.bi-note{font-size:17px;font-weight:700}
.bi-obs{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.bi-obs p{font-size:17px;overflow-wrap:anywhere}
.bi-cat{font-size:14px!important;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bi-assoc{font-size:15px!important;font-weight:700;color:var(--ink-2)}
.bi-why>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px;display:flex;align-items:center}
.bi-why>summary::-webkit-details-marker{display:none}
.bi-why>div{background:var(--raise);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.bi-why>div p{font-size:15px}
.bi-recs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;overflow-wrap:anywhere}
.bi-hit{font-weight:700}
.bi-days{display:flex;flex-direction:column}
.bi-day{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.bi-day>span{flex:1;min-width:0;font-size:17px;font-weight:700}
.bi-day small{display:block;font-size:14px;color:var(--muted);font-weight:500}
.bi-day .btn-line{min-height:42px;font-size:15px;padding:0 14px}
.bi-sug{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.bi-sug>p{font-size:17px}
.bi-sug-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.bi-sug-row .n{flex:1;min-width:0;font-size:17px;font-weight:700;overflow-wrap:anywhere}

.mc-done .n{flex:1;min-width:0;font-size:18px;font-weight:800}

<!-- BFLScanner module: unchanged (Body Fuel Lab Build 141 extraction) -->
<script id="bfl-scanner-js">
/* =============================================================================
   BFLScanner — reusable barcode + Danish food lookup module
   Public API:
     BFLScanner.mount(containerEl, {
        keyPrefix:  "bflfood_",   // localStorage prefix for favourites + serving units
        onAdd:      fn(item),     // scanned product confirmed with grams  (item shape = BFL meal item)
        onFoodPick: fn(food),     // local Danish/English search result tapped
        onManual:   fn()          // "Enter macros manually" tapped after a failed lookup
     })
     BFLScanner.lookup(barcode)  -> Promise<info>   (fetch + parse, no UI)
     BFLScanner.searchFoods(query, limit)           (local Danish/English search)
     BFLScanner.FOODDB / byKey / stateLabel / FOOD_ALIASES
     BFLScanner.stop()           // stop camera (call when hiding the scanner)
============================================================================= */
var BFLScanner=(function(){
  "use strict";

  /* ---- ADAPTED: configuration. In BFL these keys were hard-coded "bf_offfav" and
     "bf_servingunits". They are prefixed here so BFL FOOD never writes into Body Fuel
     Lab's data (both apps live on the same github.io origin and share localStorage). */
  var cfg={keyPrefix:"bflfood_",onAdd:null,onFoodPick:null,onManual:null};
  var KEY_OFFFAV="bflfood_offfav",KEY_SERVINGUNITS="bflfood_servingunits";
  var state={mlServMode:"grams",mlServSelIdx:null,mlServQty:1};
  var root=null;

  /* ===== VERBATIM: core helpers (store, $, $all, esc, flash, num) ===== */
  var store=(function(){var mem={},ok=false;try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ok=true;}catch(e){}
    return{get:function(k){try{return ok?JSON.parse(localStorage.getItem(k)):(mem[k]||null);}catch(e){return mem[k]||null;}},
      set:function(k,v){try{ok?localStorage.setItem(k,JSON.stringify(v)):(mem[k]=v);return true;}catch(e){mem[k]=v;return false;}}};})();
  function $(s,c){return (c||document).querySelector(s);}
  function $all(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function flash(sel,msg){var el=$(sel);if(!el)return;el.textContent=msg;clearTimeout(el._t);el._t=setTimeout(function(){el.textContent="";},2600);}
  function num(v){if(typeof v==="string")v=v.replace(",",".");v=parseFloat(v);return isNaN(v)?null:v;}

  /* ===== VERBATIM: local food database (per 100 g: [kcal, protein, carbs, fat, fibre]) ===== */
  var FOODDB=[
    {k:"chicken",name:"Chicken (cooked)",cat:"Protein",s:{cooked:[209,26,0,11,0]}},
    {k:"chicken_breast",name:"Chicken breast",cat:"Protein",s:{cooked:[165,31,0,3.6,0],raw:[120,23,0,2.6,0]}},
    {k:"turkey",name:"Turkey (cooked)",cat:"Protein",s:{cooked:[170,29,0,5,0]}},
    {k:"beef_mince",name:"Beef mince (cooked)",cat:"Protein",s:{cooked:[215,26,0,12,0],raw:[187,19,0,12,0]}},
    {k:"beef_steak",name:"Beef steak (cooked)",cat:"Protein",s:{cooked:[250,27,0,15,0]}},
    {k:"pork",name:"Pork (cooked)",cat:"Protein",s:{cooked:[242,27,0,14,0]}},
    {k:"white_fish",name:"White fish (cooked)",cat:"Protein",s:{cooked:[105,23,0,1,0],raw:[82,18,0,0.7,0]}},
    {k:"salmon",name:"Salmon (cooked)",cat:"Protein",s:{cooked:[208,22,0,13,0]}},
    {k:"tuna",name:"Tuna (canned in water, drained)",cat:"Protein",s:{drained:[116,26,0,1,0]}},
    {k:"sardines",name:"Sardines in oil (drained)",cat:"Protein",s:{drained:[215,24,0,13,0]}},
    {k:"proteinbar",name:"Protein bar",cat:"Protein",s:{bar:[360,32,40,12,6]}},
    {k:"bacon",name:"Bacon (cooked)",cat:"Protein",s:{cooked:[540,37,1,42,0]}},
    {k:"ham",name:"Ham",cat:"Protein",s:{aseaten:[145,18,1.5,6,0]}},
    {k:"jasmine_rice",name:"Jasmine rice",cat:"Carb",s:{cooked:[130,2.7,28,0.3,0.4],dry:[360,7,80,0.6,1.3]}},
    {k:"basmati_rice",name:"Basmati rice",cat:"Carb",s:{cooked:[121,3,25,0.4,0.6],dry:[350,8,77,0.9,1.4]}},
    {k:"brown_rice",name:"Brown rice",cat:"Carb",s:{cooked:[123,2.7,26,1,1.6],dry:[367,8,77,2.7,3.5]}},
    {k:"potato",name:"Potatoes (boiled)",cat:"Carb",s:{cooked:[87,2,20,0.1,1.8],raw:[77,2,17,0.1,2.2]}},
    {k:"sweet_potato",name:"Sweet potato (cooked)",cat:"Carb",s:{cooked:[90,2,21,0.1,3.3]}},
    {k:"gf_oats",name:"Gluten-free oats (dry)",cat:"Carb",s:{dry:[379,13,67,7,10]}},
    {k:"gf_pasta",name:"Gluten-free pasta",cat:"Carb",s:{cooked:[130,2.5,28,0.5,1],dry:[357,6,77,2,2.5]}},
    {k:"gf_bread",name:"Gluten-free bread",cat:"Carb",s:{aseaten:[250,4,48,4,3]}},
    {k:"rice_cakes",name:"Rice cakes",cat:"Carb",s:{aseaten:[387,8,82,3,4]},serv:[["1 rice cake",9],["2 rice cakes",18],["3 rice cakes",27]],defg:18},
    {k:"salad",name:"Mixed salad leaves",cat:"Veg & fruit",s:{raw:[17,1.4,2,0.2,1.5]}},
    {k:"green_beans",name:"Green beans (cooked)",cat:"Veg & fruit",s:{cooked:[35,1.9,7,0.2,3.4]}},
    {k:"peas",name:"Peas (cooked)",cat:"Veg & fruit",s:{cooked:[84,5,14,0.4,5]}},
    {k:"cucumber",name:"Cucumber",cat:"Veg & fruit",s:{raw:[15,0.7,3.6,0.1,0.5]}},
    {k:"carrots",name:"Carrots (cooked)",cat:"Veg & fruit",s:{cooked:[35,0.8,8,0.2,3]}},
    {k:"blueberries",name:"Blueberries",cat:"Veg & fruit",s:{raw:[57,0.7,14,0.3,2.4]}},
    {k:"raspberries",name:"Raspberries",cat:"Veg & fruit",s:{raw:[52,1.2,12,0.7,6.5]}},
    {k:"apple",name:"Apple",cat:"Veg & fruit",s:{raw:[52,0.3,14,0.2,2.4]},serv:[["Small apple",150],["Medium apple",180],["Large apple",220]],defg:180},
    {k:"pear",name:"Pear",cat:"Veg & fruit",s:{raw:[57,0.4,15,0.1,3.1]}},
    {k:"banana",name:"Banana",cat:"Veg & fruit",s:{raw:[89,1.1,23,0.3,2.6]},serv:[["Small banana",100],["Medium banana",118],["Large banana",136]],defg:118},
    {k:"pineapple",name:"Pineapple",cat:"Veg & fruit",s:{raw:[50,0.5,13,0.1,1.4],drained:[60,0.5,15,0.1,1]}},
    {k:"bok_choy",name:"Bok choy",cat:"Veg & fruit",s:{cooked:[12,1.6,1.8,0.2,1],raw:[13,1.5,2.2,0.2,1]}},
    {k:"olive_oil",name:"Olive oil",cat:"Fat",s:{aseaten:[884,0,0,100,0]}},
    {k:"butter",name:"Butter",cat:"Fat",s:{aseaten:[717,0.9,0.1,81,0]}},
    {k:"mayo",name:"Mayonnaise",cat:"Fat",s:{aseaten:[680,1,1,75,0]}},
    {k:"ghee",name:"Ghee",cat:"Fat",s:{aseaten:[900,0,0,100,0]}},
    {k:"honey",name:"Honey",cat:"Extra",s:{aseaten:[304,0.3,82,0,0.2]}}
  ];
  var byKey={};FOODDB.forEach(function(f){byKey[f.k]=f;});
  var stateLabel={cooked:"Cooked",raw:"Raw",dry:"Dry",drained:"Drained",aseaten:"As eaten"};

  /* ===== VERBATIM: Danish/English aliases + local search + results list ===== */
  var FOOD_ALIASES={
    chicken:["kylling"],chicken_breast:["kylling","kyllingebryst"],turkey:["kalkun"],
    beef_mince:["oksekod","hakket oksekod","hakkekod"],beef_steak:["oksekod","bof","oksemorbrad"],
    pork:["svinekod","flaesk"],white_fish:["hvid fisk","fisk"],salmon:["laks"],tuna:["tun"],sardines:["sardiner"],
    ham:["skinke"],jasmine_rice:["ris","jasminris"],basmati_rice:["ris","basmatiris"],brown_rice:["ris","brune ris"],
    potato:["kartofler","kartoffel"],sweet_potato:["sode kartofler","batat"],gf_oats:["havregryn","havre"],
    gf_pasta:["pasta"],gf_bread:["brod"],rice_cakes:["riskiks"],salad:["salat"],green_beans:["gronne bonner","bonner"],
    peas:["aerter"],cucumber:["agurk"],carrots:["gulerodder","gulerod"],blueberries:["blabaer"],raspberries:["hindbaer"],
    apple:["aeble"],pear:["paere"],banana:["banan"],pineapple:["ananas"],bok_choy:["pak choi"],
    olive_oil:["olivenolie"],butter:["smor"],mayo:["mayonnaise"],ghee:["ghee"],honey:["honning"]
  };
  function foodSearchNorm(s){return String(s||"").toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a");}
  var FOOD_SEARCH_INDEX=null;
  function buildFoodSearchIndex(){
    FOOD_SEARCH_INDEX=FOODDB.map(function(d){
      var terms=[d.name].concat(FOOD_ALIASES[d.k]||[]);
      return {d:d,hay:foodSearchNorm(terms.join(" | "))};
    });
  }
  function fmt1(n){n=+n||0;return Math.round(n*10)/10;}
  function searchFoods(query,limit){
    limit=limit||8;
    if(!FOOD_SEARCH_INDEX)buildFoodSearchIndex();
    var q=foodSearchNorm(query).trim();
    if(!q)return [];
    var out=[];
    FOOD_SEARCH_INDEX.forEach(function(e){
      if(e.hay.indexOf(q)<0)return;
      Object.keys(e.d.s).forEach(function(st){out.push({d:e.d,state:st});});
    });
    return out.slice(0,limit);
  }
  function renderMlSearchResults(query){
    var box=$("#ml-search-results");if(!box)return;
    var q=(query||"").trim();
    if(!q){box.innerHTML='';return;}
    var results=searchFoods(q,8);
    state.mlSearchCache=results;
    if(!results.length){box.innerHTML='<p class="ml-quick-empty">No matches in your current food list.</p>';return;}
    box.innerHTML=results.map(function(r,i){
      var v=r.d.s[r.state],multi=Object.keys(r.d.s).length>1;
      var stLabel=multi?(' \u00b7 '+(stateLabel[r.state]||r.state)):'';
      return '<button type="button" class="ml-search-row" data-searchpick="'+i+'">'
        +'<div class="msr-n">'+esc(r.d.name)+stLabel+'</div>'
        +'<div class="msr-macros">'+Math.round(v[0])+' kcal \u00b7 '+fmt1(v[1])+'P \u00b7 '+fmt1(v[2])+'C \u00b7 '+fmt1(v[3])+'F</div>'
        +'</button>';
    }).join('');
  }

  /* ===== VERBATIM: Open Food Facts lookup, parsing, status messages ===== */
  /* ---------- barcode lookup via Open Food Facts (read-only, single request per scan) ---------- */
  /* NOTE: We do NOT send a custom User-Agent header. Browsers treat "User-Agent" as a
     non-safelisted header, which forces a CORS preflight (OPTIONS) request. Open Food Facts'
     API does not include "User-Agent" in Access-Control-Allow-Headers for that preflight, so
     the browser blocks the real GET before it's ever sent -- this is what caused every real
     lookup on GitHub Pages/Safari to fail with a generic network error, even though the exact
     same request worked in mocked testing (mocks don't enforce CORS). Keeping this request to
     only CORS-safelisted headers (no custom headers at all) avoids the preflight entirely. */
  var OFF_APP_ID="BodyFuelLab/1.0";
  var OFF_MIN_INTERVAL_MS=1200;
  function offBuildUrl(barcode){
    return "https://world.openfoodfacts.org/api/v3/product/"+encodeURIComponent(barcode)+".json?fields=code,product_name,product_name_en,brands,serving_size,nutriments";
  }
  function offFetchProduct(barcode){
    return fetch(offBuildUrl(barcode),{method:"GET"}).then(function(r){
      if(!r.ok)throw new Error("network");
      return r.json();
    });
  }
  function offParseProduct(data,barcode){
    if(!data)return {found:false};
    var okStatus=data.status===1||data.status==="1"||data.status==="success";
    if(!okStatus||!data.product)return {found:false};
    var p=data.product,n=p.nutriments||{};
    var kcal=n["energy-kcal_100g"];if(kcal==null)kcal=n["energy-kcal"];
    var protein=n["proteins_100g"],carbs=n["carbohydrates_100g"],fat=n["fat_100g"],fib=n["fiber_100g"];
    var complete=kcal!=null&&protein!=null&&carbs!=null&&fat!=null;
    return {
      found:true,complete:complete,
      barcode:data.code||p.code||barcode,
      name:p.product_name||p.product_name_en||"",
      brand:p.brands||"",
      serving:p.serving_size||"",
      kcal:kcal,protein:protein,carbs:carbs,fat:fat,fib:fib
    };
  }
  function renderScanMsg(msg){var el=$("#ml-scan-result");if(el)el.innerHTML=msg?('<p class="ml-quick-empty">'+msg+'</p>'):'';}
  function renderScanNotFound(reason){
    var box=$("#ml-scan-result");if(!box)return;
    box.innerHTML='<p class="ml-quick-empty">'+esc(reason)+' You can use manual macro entry instead.</p>'
      +'<button type="button" class="linkbtn" id="ml-scan-manual">\u270e Enter macros manually</button>';
  }

  /* ===== VERBATIM (storage key names only → prefixed constants): serving units + OFF favourites ===== */
  /* ---------- reusable serving units (general feature, additive only) ----------
     Stored separately from FOODDB and from bf_foodfav so neither existing structure
     is altered. Keyed by a food "identity": the FOODDB key for built-in foods, or
     "off:"+barcode for Open Food Facts products. A food with no saved serving simply
     has no entry here and keeps working in grams exactly as before. */
  function offIdentity(barcode){return "off:"+barcode;}
  function loadServingUnits(identity){var all=store.get(KEY_SERVINGUNITS)||{};return all[identity]||[];}
  function saveServingUnit(identity,name,grams){
    var all=store.get(KEY_SERVINGUNITS)||{};
    var arr=(all[identity]||[]).filter(function(s){return s.name.toLowerCase()!==name.toLowerCase();});
    arr.push({name:name,grams:grams});
    all[identity]=arr;store.set(KEY_SERVINGUNITS,all);
    return arr;
  }
  /* ---------- Open Food Facts favourites (separate from bf_foodfav, which stays FOODDB-key-only) ---------- */
  function loadOffFav(){return store.get(KEY_OFFFAV)||[];}
  function saveOffFavList(arr){store.set(KEY_OFFFAV,arr);}
  function findOffFavIdx(barcode){var arr=loadOffFav();for(var i=0;i<arr.length;i++){if(arr[i].barcode===barcode)return i;}return -1;}
  function isOffFav(barcode){return findOffFavIdx(barcode)>=0;}
  function toggleOffFav(info){
    var arr=loadOffFav(),idx=findOffFavIdx(info.barcode);
    if(idx>=0)arr.splice(idx,1);
    else arr.push({barcode:info.barcode,name:info.name,brand:info.brand,kcal:info.kcal,protein:info.protein,carbs:info.carbs,fat:info.fat,fib:info.fib});
    saveOffFavList(arr);
  }
  function parseServingGrams(s){
    if(!s)return null;
    var m=String(s).match(/(\d+(?:[.,]\d+)?)\s*g\b/i);
    if(!m)return null;
    var n=parseFloat(m[1].replace(",","."));
    return isFinite(n)?n:null;
  }

  /* ===== VERBATIM: shared serving-picker UI ===== */
  /* ---------- shared serving-picker UI (used by both FOODDB items and Open Food Facts items) ---------- */
  function servingBlockHTML(identity,hint){
    var units=loadServingUnits(identity),mode=state.mlServMode,selIdx=state.mlServSelIdx,qty=state.mlServQty||1;
    var html='';
    if(hint)html+='<p class="ml-quick-empty">Serving size found: '+esc(hint)+'</p>';
    html+='<div class="serv-row">';
    html+='<button type="button" class="serv-chip'+(mode==="grams"?" on":"")+'" data-servmode="grams">Use grams</button>';
    units.forEach(function(u,i){html+='<button type="button" class="serv-chip'+((mode==="unit"&&selIdx===i)?" on":"")+'" data-servmode="unit" data-servidx="'+i+'">'+esc(u.name)+'</button>';});
    html+='<button type="button" class="serv-chip'+(mode==="new"?" on":"")+'" data-servmode="new">+ Create serving</button>';
    html+='</div>';
    if(mode==="unit"&&units[selIdx]){
      var u=units[selIdx];
      html+='<div class="serv-qty-row"><label>Quantity</label><input id="ml-serv-qty" type="text" inputmode="decimal" value="'+qty+'"><span class="serv-qty-total">'+fmt1(u.grams)+'g each \u00b7 = '+fmt1(qty*u.grams)+'g total</span></div>';
    }
    if(mode==="new"){
      var prefill=hint?parseServingGrams(hint):null;
      html+='<div class="serv-new-row"><input id="ml-serv-name" type="text" placeholder="Serving name, e.g. Rice cake"><input id="ml-serv-grams" type="text" inputmode="decimal" placeholder="grams per 1"'+(prefill!=null?(' value="'+prefill+'"'):'')+'><button type="button" class="linkbtn" id="ml-serv-save">Save serving</button></div>';
    }
    return html;
  }
  function servingGramsFor(identity){
    if(state.mlServMode!=="unit")return null;
    var units=loadServingUnits(identity),u=units[state.mlServSelIdx];
    if(!u)return null;
    return (state.mlServQty||1)*u.grams;
  }
  function rerenderOffServingBlock(){
    var box=$("#ml-offserv-block");if(!box||!state.mlScanInfo)return;
    var info=state.mlScanInfo,identity=offIdentity(info.barcode);
    box.innerHTML=servingBlockHTML(identity,info.serving||null);
    var g=servingGramsFor(identity);
    if(g!=null){var gi=$("#ml-scan-grams");if(gi)gi.value=fmt1(g);}
  }
  function currentServIdentity(){
    if(state.mlScanInfo)return offIdentity(state.mlScanInfo.barcode);
    if(state.mlFood&&state.mlFood!=="__custom__")return state.mlFood;
    return null;
  }
  function resetServingState(){state.mlServMode="grams";state.mlServSelIdx=null;state.mlServQty=1;}

  /* ===== VERBATIM: confirm card + barcode lookup flow ===== */
  function renderScanConfirm(info){
    var box=$("#ml-scan-result");if(!box)return;
    state.mlScanInfo=info;
    resetServingState();
    var identity=offIdentity(info.barcode);
    var favOn=isOffFav(info.barcode);
    box.innerHTML='<div class="ml-scan-confirm">'
      +'<div class="msc-name">'+esc(info.name||"Unnamed product")+'</div>'
      +(info.brand?'<div class="msc-brand">'+esc(info.brand)+'</div>':'')
      +'<div class="msc-macros">'+Math.round(info.kcal)+' kcal \u00b7 '+fmt1(info.protein)+'P \u00b7 '+fmt1(info.carbs)+'C \u00b7 '+fmt1(info.fat)+'F <span class="msc-per">per 100g</span></div>'
      +'<div class="msc-source">Source: Open Food Facts \u00b7 barcode '+esc(info.barcode)+'</div>'
      +'<button type="button" class="fav-toggle'+(favOn?' on':'')+'" id="ml-off-favtoggle" style="margin-top:8px">'+(favOn?'\u2605 Favourited':'\u2606 Save to Favourites')+'</button>'
      +'<div id="ml-offserv-block">'+servingBlockHTML(identity,info.serving||null)+'</div>'
      +'<div class="pmeal-grid" style="margin-top:10px"><div class="pmeal"><label>Grams</label><input id="ml-scan-grams" type="text" inputmode="decimal" placeholder="g"></div><div class="pmeal"></div></div>'
      +'<button type="button" class="cta" id="ml-scan-add" style="margin-top:10px">Add to meal</button>'
      +'<div class="saved-note" id="ml-scan-saved"></div>'
      +'</div>';
  }
  function doBarcodeLookup(barcode){
    barcode=String(barcode||"").trim().replace(/\D/g,"");
    if(!barcode){renderScanMsg("Enter a barcode number first.");return;}
    if(state.mlScanLoading)return;
    var now=Date.now();
    if(state.mlLastOffCall&&(now-state.mlLastOffCall)<OFF_MIN_INTERVAL_MS)return;
    state.mlLastOffCall=now;state.mlScanLoading=true;
    var btn=$("#ml-scan-lookup");if(btn)btn.disabled=true;
    renderScanMsg("Looking up\u2026");
    offFetchProduct(barcode).then(function(data){
      var info=offParseProduct(data,barcode);
      if(!info.found){renderScanNotFound("Product not found.");return;}
      if(!info.complete){renderScanNotFound("Nutrition information incomplete for this product.");return;}
      renderScanConfirm(info);
    }).catch(function(){
      renderScanNotFound("Could not reach Open Food Facts. Check your connection and try again.");
    }).then(function(){
      state.mlScanLoading=false;
      var b=$("#ml-scan-lookup");if(b)b.disabled=false;
    });
  }

  /* ===== ADAPTED: addScanItem. The item object is built exactly as in BFL; instead of
     writing into BFL's meal log (loadMealDay/saveMealDay + BFL-only re-renders) it is
     handed to cfg.onAdd so BFL FOOD decides where to store it. "meal" is left for the host. */
  function addScanItem(){
    var info=state.mlScanInfo;if(!info)return;
    var g=num($("#ml-scan-grams").value);
    if(g==null||g<=0){flash("#ml-scan-saved","Enter the grams first");return;}
    var si={id:String(Date.now())+Math.round(Math.random()*999),meal:state.mlMeal||null,custom:true,offSource:true,
      name:info.name+(info.brand?" ("+info.brand+")":""),grams:g,
      macros:{kcal:info.kcal*g/100,p:info.protein*g/100,c:info.carbs*g/100,f:info.fat*g/100,fib:(info.fib!=null?info.fib*g/100:0)},
      notes:"Open Food Facts · barcode "+info.barcode};
    if(state.mlServMode==="unit"){
      var su=loadServingUnits(offIdentity(info.barcode))[state.mlServSelIdx];
      if(su){si.servingName=su.name;si.servingQty=state.mlServQty||1;si.servingGrams=su.grams;}
    }
    if(typeof cfg.onAdd==="function")cfg.onAdd(si);
    flash("#ml-scan-saved","Added");
  }

  /* ===== VERBATIM: camera scanning (BarcodeDetector, feature-detected) ===== */
  /* ---------- optional camera-assisted scan (progressive enhancement, feature-detected) ---------- */
  function offCameraSupported(){return !!(window.BarcodeDetector&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);}
  function stopBarcodeCamera(){
    if(state.mlScanStream){state.mlScanStream.getTracks().forEach(function(t){t.stop();});state.mlScanStream=null;}
    if(state.mlScanRAF){cancelAnimationFrame(state.mlScanRAF);state.mlScanRAF=null;}
    var v=$("#ml-scan-video"),cb=$("#ml-scan-cam"),xb=$("#ml-scan-cam-cancel");
    if(v){v.style.display="none";v.srcObject=null;}
    if(cb)cb.style.display="";
    if(xb)xb.style.display="none";
  }
  function startBarcodeCamera(){
    if(!offCameraSupported())return;
    var v=$("#ml-scan-video"),cb=$("#ml-scan-cam"),xb=$("#ml-scan-cam-cancel");
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(stream){
      state.mlScanStream=stream;
      if(v){v.srcObject=stream;v.style.display="block";v.play();}
      if(cb)cb.style.display="none";
      if(xb)xb.style.display="";
      var detector=new window.BarcodeDetector();
      var found=false;
      function tick(){
        if(found||!state.mlScanStream)return;
        detector.detect(v).then(function(codes){
          if(found||!codes||!codes.length)return;
          found=true;
          var code=codes[0].rawValue;
          stopBarcodeCamera();
          var bi=$("#ml-barcode");if(bi){bi.value=code;state.mlBarcodeQuery=code;}
          doBarcodeLookup(code);
        }).catch(function(){});
        if(!found)state.mlScanRAF=requestAnimationFrame(tick);
      }
      state.mlScanRAF=requestAnimationFrame(tick);
    }).catch(function(){
      renderScanMsg("Could not access the camera. Enter the barcode number instead.");
    });
  }

  /* ===== ADAPTED: renderQuick — the Favourites / Search / Scan sections of BFL's
     renderMlQuick(), without "Recent" (that list is built from BFL's meal log). ===== */
  function renderQuick(){
    var box=root;if(!box)return;
    var offFavItems=loadOffFav();
    var html='<div class="ml-quick-sec"><div class="ml-quick-h">Favourites</div>';
    if(offFavItems.length){
      html+='<div class="ml-chiprow">'
        +offFavItems.map(function(f,i){return '<button type="button" class="ml-chip" data-offfavpick="'+i+'"><span class="mc-n">'+esc(f.name)+'</span>'+(f.brand?'<span class="mc-s">'+esc(f.brand)+'</span>':'')+'</button>';}).join('')
        +'</div>';
    } else {
      html+='<p class="ml-quick-empty">Tap ☆ Save to Favourites on a scanned product to save it here.</p>';
    }
    html+='</div><div class="ml-quick-sec"><div class="ml-quick-h">Search</div>'
      +'<input class="mealinput" id="ml-search" type="text" placeholder="Search foods… (English or Danish)" style="margin-bottom:6px">'
      +'<div id="ml-search-results"></div></div>';
    html+='<div class="ml-quick-sec"><div class="ml-quick-h">Scan</div>'
      +'<div class="ml-scan-inputrow"><input class="mealinput" id="ml-barcode" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Barcode number"><button type="button" class="cta ghost" id="ml-scan-lookup">Look up</button></div>'
      +(offCameraSupported()?'<button type="button" class="linkbtn" id="ml-scan-cam" style="margin-top:6px">📷 Scan with camera</button><button type="button" class="linkbtn" id="ml-scan-cam-cancel" style="margin-top:6px;display:none">Cancel camera</button>':'')
      +'<video id="ml-scan-video" playsinline muted style="display:none"></video>'
      +'<div id="ml-scan-result"></div></div>';
    box.innerHTML=html;
    var si=$("#ml-search");
    if(si){si.value=state.mlSearchQuery||"";renderMlSearchResults(si.value);}
    var bi=$("#ml-barcode");
    if(bi)bi.value=state.mlBarcodeQuery||"";
  }

  /* ===== ADAPTED: event wiring — the scan/search/serving branches of BFL's #food
     click/input/keydown listeners, attached to the mount container instead. ===== */
  function wire(el){
    el.addEventListener("click",function(e){
      var ofp=e.target.closest("[data-offfavpick]");if(ofp){var fav=loadOffFav()[+ofp.getAttribute("data-offfavpick")];if(fav){renderScanConfirm({found:true,complete:true,barcode:fav.barcode,name:fav.name,brand:fav.brand,serving:null,kcal:fav.kcal,protein:fav.protein,carbs:fav.carbs,fat:fav.fat,fib:fav.fib});}return;}
      var sp=e.target.closest("[data-searchpick]");if(sp){var r=(state.mlSearchCache||[])[+sp.getAttribute("data-searchpick")];if(r&&typeof cfg.onFoodPick==="function"){var v=r.d.s[r.state];cfg.onFoodPick({kind:"db",key:r.d.k,name:r.d.name,state:r.state,grams:r.d.defg||null,per100g:{kcal:v[0],p:v[1],c:v[2],f:v[3],fib:v[4]},serv:r.d.serv||null,cat:r.d.cat});}return;}
      var oft=e.target.closest("#ml-off-favtoggle");if(oft){if(state.mlScanInfo){toggleOffFav(state.mlScanInfo);var nowFav=isOffFav(state.mlScanInfo.barcode);oft.textContent=nowFav?"★ Favourited":"☆ Save to Favourites";oft.classList.toggle("on",nowFav);}return;}
      var sl=e.target.closest("#ml-scan-lookup");if(sl){var bc=$("#ml-barcode");doBarcodeLookup(bc?bc.value:"");return;}
      var sc=e.target.closest("#ml-scan-cam");if(sc){startBarcodeCamera();return;}
      var scc=e.target.closest("#ml-scan-cam-cancel");if(scc){stopBarcodeCamera();return;}
      var sa=e.target.closest("#ml-scan-add");if(sa){addScanItem();return;}
      var sm=e.target.closest("#ml-scan-manual");if(sm){if(typeof cfg.onManual==="function")cfg.onManual();return;}
      var svm=e.target.closest("[data-servmode]");
      if(svm){
        var mode=svm.getAttribute("data-servmode");
        if(mode==="unit"){state.mlServMode="unit";state.mlServSelIdx=+svm.getAttribute("data-servidx");state.mlServQty=state.mlServQty||1;}
        else{state.mlServMode=mode;}
        if(state.mlScanInfo)rerenderOffServingBlock();
        return;
      }
      var svs=e.target.closest("#ml-serv-save");
      if(svs){
        var nmEl=$("#ml-serv-name"),gEl=$("#ml-serv-grams");
        var nmv=(nmEl&&nmEl.value||"").trim(),gv=num(gEl&&gEl.value);
        if(!nmv||gv==null||gv<=0)return;
        var idn=currentServIdentity();if(!idn)return;
        var arr=saveServingUnit(idn,nmv,gv);
        state.mlServMode="unit";state.mlServSelIdx=arr.length-1;state.mlServQty=1;
        if(state.mlScanInfo)rerenderOffServingBlock();
        return;
      }
    });
    el.addEventListener("input",function(e){
      if(e.target&&e.target.id==="ml-search"){state.mlSearchQuery=e.target.value;renderMlSearchResults(e.target.value);}
      if(e.target&&e.target.id==="ml-barcode"){state.mlBarcodeQuery=e.target.value;}
      if(e.target&&e.target.id==="ml-serv-qty"){
        state.mlServQty=num(e.target.value)||0;
        var idn2=currentServIdentity();if(!idn2)return;
        var g=servingGramsFor(idn2);if(g==null)return;
        var units=loadServingUnits(idn2),u=units[state.mlServSelIdx];
        if(state.mlScanInfo){
          var gi=$("#ml-scan-grams");if(gi)gi.value=fmt1(g);
          var tot=document.querySelector("#ml-offserv-block .serv-qty-total");if(tot&&u)tot.textContent=fmt1(u.grams)+"g each · = "+fmt1(g)+"g total";
        }
      }
    });
    el.addEventListener("keydown",function(e){
      if(e.target&&e.target.id==="ml-barcode"&&e.key==="Enter"){e.preventDefault();doBarcodeLookup(e.target.value);}
    });
  }

  function mount(el,opts){
    opts=opts||{};
    for(var k in opts){if(Object.prototype.hasOwnProperty.call(opts,k))cfg[k]=opts[k];}
    KEY_OFFFAV=cfg.keyPrefix+"offfav";KEY_SERVINGUNITS=cfg.keyPrefix+"servingunits";
    root=el;renderQuick();wire(el);
  }
  function lookup(barcode){
    barcode=String(barcode||"").trim().replace(/\D/g,"");
    return offFetchProduct(barcode).then(function(d){return offParseProduct(d,barcode);});
  }
  return {mount:mount,lookup:lookup,searchFoods:searchFoods,stop:stopBarcodeCamera,refresh:renderQuick,
    setMeal:function(m){state.mlMeal=m;},
    FOODDB:FOODDB,byKey:byKey,stateLabel:stateLabel,FOOD_ALIASES:FOOD_ALIASES,
    offBuildUrl:offBuildUrl,offParseProduct:offParseProduct,parseServingGrams:parseServingGrams};
})();
</script>

<script id="bfl-food-app">
(function(){
"use strict";
var SC=window.BFLScanner;
var K={profile:"bflfood_profile",goals:"bflfood_goals",fuel:"bflfood_fuel",progress:"bflfood_progress",diary:"bflfood_diary",custom:"bflfood_customfoods",favs:"bflfood_favs",ui:"bflfood_ui"};
var mem={};
var DB={
  get:function(k,def){try{var v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:def):JSON.parse(v);}catch(e){return k in mem?mem[k]:def;}},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
};
function $(s,c){return (c||document).querySelector(s);}
/* ===== Engine: copied unchanged from BFL FOOD v1 (calculations, food data, safety checks) ===== */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){if(v==null)return null;if(typeof v==="number")return isFinite(v)?v:null;v=String(v).trim().replace(",",".");if(v==="")return null;var n=parseFloat(v);return isFinite(n)?n:null;}
function r1(n){return Math.round(n*10)/10;}
function fmtN(n,unit){if(n==null)return "n/a";var s=(Math.abs(n)>=100?Math.round(n):r1(n)).toString().replace(".",",");return unit?s+" "+unit:s;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function norm(s){return String(s||"").toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a").replace(/[éèê]/g,"e");}
function clone(o){return JSON.parse(JSON.stringify(o));}
var NUTS=["kcal","p","c","f","fib"];
var NUT_LABEL={kcal:"kcal",p:"Protein",c:"Carbs",f:"Fat",fib:"Fibre"};
function portion(per100,qty){var o={};NUTS.forEach(function(k){o[k]=(per100&&per100[k]!=null&&qty!=null)?per100[k]*qty/100:null;});return o;}
function sumItems(items){
  var t={kcal:0,p:0,c:0,f:0,fib:0},miss={kcal:0,p:0,c:0,f:0,fib:0};
  items.forEach(function(it){var pn=portion(it.per100,it.qty);NUTS.forEach(function(k){if(pn[k]==null)miss[k]++;else t[k]+=pn[k];});});
  t.miss=miss;t.count=items.length;return t;
}
var FOODDB=SC.FOODDB,byKey=SC.byKey,stateLabel=SC.stateLabel;
function dbFood(key,st){
  var d=byKey[key];if(!d)return null;var states=Object.keys(d.s);if(!st||!d.s[st])st=states[0];var v=d.s[st];
  return {src:"db",ref:key,name:d.name,state:st,states:states,unit:"g",per100:{kcal:v[0],p:v[1],c:v[2],f:v[3],fib:v[4]},cat:d.cat,
    presets:(d.serv||[]).map(function(s){return [s[0],s[1]];}),defQty:d.defg||100,ingredients:null,allergens:[],traces:[],allergenText:""};
}
function catOf(it){
  if(it.cat)return it.cat;
  var p=it.per100||{};if(p.p==null||p.c==null||p.f==null)return "Unknown";
  var s=p.p*4+p.c*4+p.f*9;if(!s)return "Unknown";
  if(p.p*4/s>=.4)return "Protein";if(p.c*4/s>=.5)return "Carb";if(p.f*9/s>=.55)return "Fat";return "Mixed";
}
var SRC_LABEL={db:"Built-in food list",off:"Open Food Facts",manual:"Your entry",custom:"Your saved food"};
var STATUS=[["allergy","Confirmed allergy"],["intolerance","Diagnosed intolerance"],["suspected","Suspected sensitivity"],["tolerated","Personally tolerated"],["avoid","Prefer to avoid"],["noteval","Not yet evaluated"]];
var STATUS_LABEL={};STATUS.forEach(function(s){STATUS_LABEL[s[0]]=s[1];});
var LEVEL_RANK={allergy:0,intolerance:1,suspected:2,avoid:3,tolerated:4,noteval:5};
var DEFAULT_CONS=[
  {id:"gluten",name:"Gluten",tags:["en:gluten"],kw:["gluten","wheat","barley","rye","spelt","semolina","couscous","bulgur","malt","~hvede","rug*","byg*","spelt*","maltekstrakt"],free:["gluten-free","gluten free","glutenfri","glutenfrit"]},
  {id:"lactose",name:"Lactose",tags:["en:milk"],kw:["lactose","milk","cream","whey","butter","cheese","yoghurt","yogurt","buttermilk","~laktose","~maelk","flode*","valle*","smor*","ost","oste*","skyr","kvark"],free:["lactose-free","lactose free","laktosefri","laktosefrit"]},
  {id:"histamine",name:"Histamine",tags:[],kw:[],insufficient:"Food labels don't list histamine, and the Food Tracker has no reliable histamine data for this food yet."},
  {id:"peas",name:"Peas and pea protein",tags:[],kw:["pea","pea protein","aert*"]},
  {id:"soy",name:"Soy",tags:["en:soybeans"],kw:["soy","soya","soybean","soja*"]},
  {id:"nuts",name:"Almonds and other nuts",tags:["en:nuts"],kw:["almond","hazelnut","walnut","cashew","pistachio","pecan","macadamia","nut","mandel*","mandler","~hasselnod","~valnod","cashew*","pistacie*","nodder"]},
  {id:"cocoa",name:"Cocoa",tags:[],kw:["cocoa","cacao","chocolate","kakao*","~chokolade"]},
  {id:"pollen",name:"Pollen-related food reactions",tags:[],kw:[],insufficient:"Pollen-related reactions depend on your specific pollen allergy. The Food Tracker can't assess this from food data."},
  {id:"salicylates",name:"Salicylates",tags:[],kw:[],insufficient:"Food labels don't list salicylates, and published values vary a lot between sources."}
];
var GK={
  butter:{lactose:"Butter is a dairy product and contains small amounts of lactose."},
  ghee:{lactose:"Ghee is made from butter. It is usually very low in lactose, but it is a dairy product."},
  peas:{peas:"This food is peas."},
  gf_oats:{gluten:"Sold as gluten-free. Check the label of the product you buy."},
  gf_pasta:{gluten:"Sold as gluten-free. Check the label of the product you buy."},
  gf_bread:{gluten:"Sold as gluten-free. Check the label of the product you buy."}
};
var UNKNOWN_INGR={proteinbar:"Protein bar ingredients vary by brand, so the Food Tracker can't check them. Scan the bar's barcode instead."};
function loadProfile(){
  var p=DB.get(K.profile,null);
  if(!p){p={setup:false,cons:DEFAULT_CONS.map(function(c){return {id:c.id,status:"noteval"};})};}
  return p;
}
function saveProfile(p){DB.set(K.profile,p);}
function consList(){
  var p=loadProfile();
  return p.cons.map(function(c){
    var def=DEFAULT_CONS.filter(function(d){return d.id===c.id;})[0];
    if(def)return Object.assign({},def,{status:c.status});
    return {id:c.id,name:c.name,status:c.status,tags:[],kw:(c.kw||[]).map(function(k){return k+"*";}),custom:true};
  });
}
function kwRegex(kw){
  var any=kw.charAt(0)==="~",pre=kw.slice(-1)==="*";var w=norm(kw.replace(/^~/,"").replace(/\*$/,"")).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(any)return new RegExp(w);
  return new RegExp("(^|[^a-z])"+w+(pre?"":"(s|es|er|e)?($|[^a-z])"));
}
function tagLabel(t){return String(t).replace(/^[a-z]{2}:/,"").replace(/-/g," ").replace(/^./,function(c){return c.toUpperCase();});}
function checkFood(food){
  var hits=[],insufficient=[],gaps=[];
  var cons=consList();
  var nameTxt=norm(food.name+" "+(food.brand||""));
  var ingTxt=norm((food.ingredients||"")+" "+(food.allergenText||""));
  cons.forEach(function(c){
    var reasons=[];
    (c.tags||[]).forEach(function(t){
      if((food.allergens||[]).indexOf(t)>=0)reasons.push("Declared allergen: "+tagLabel(t));
      if((food.traces||[]).indexOf(t)>=0)reasons.push("May contain traces: "+tagLabel(t));
    });
    var txt=nameTxt+" | "+ingTxt,freeHit=false;
    (c.free||[]).forEach(function(f){var nf=norm(f);if(txt.indexOf(nf)>=0){freeHit=true;txt=txt.split(nf).join(" ");}});
    var seen={};
    (c.kw||[]).forEach(function(k){if(kwRegex(k).test(txt)){var w=k.replace(/^~/,"").replace(/\*$/,"");if(!seen[w]){seen[w]=1;reasons.push("Name or ingredients mention “"+w+"”");}}});
    if(food.src==="db"&&GK[food.ref]&&GK[food.ref][c.id])reasons.push(GK[food.ref][c.id]+" (general knowledge)");
    if(freeHit)reasons.push("Labelled "+(c.id==="gluten"?"gluten-free":"lactose-free")+". That's the manufacturer's claim, not a guarantee for you.");
    if(reasons.length)hits.push({c:c,level:c.status,reasons:reasons});
    else if(c.insufficient&&c.status!=="noteval"&&c.status!=="tolerated")insufficient.push(c);
  });
  if(food.src==="db"){if(UNKNOWN_INGR[food.ref])gaps.push(UNKNOWN_INGR[food.ref]);else gaps.push("Built-in foods have no ingredient or allergen list. Matches come from the food's name and general knowledge only.");}
  else{
    if(!food.ingredients)gaps.push("No ingredient list available for this food.");
    if(food.src==="off"&&!(food.allergens||[]).length)gaps.push("No allergens declared in the Open Food Facts entry. That doesn't mean the product has none.");
  }
  hits.sort(function(a,b){return LEVEL_RANK[a.level]-LEVEL_RANK[b.level];});
  return {hits:hits,insufficient:insufficient,gaps:gaps,worst:hits.length?hits[0].level:null};
}
function isBlocking(level){return level==="allergy"||level==="intolerance"||level==="suspected"||level==="avoid";}
var STRAT=[["cut","Cut"],["maintain","Maintain"],["build","Build"]];
var STRAT_LABEL={cut:"Cut",maintain:"Maintain",build:"Build"};
var ACT=[["sedentary",1.2,"Mostly sitting","Desk work, under about 5,000 steps a day, little planned exercise"],
  ["light",1.375,"Lightly active","About 5,000–7,500 steps a day, or 1–3 workouts a week"],
  ["moderate",1.55,"Moderately active","About 7,500–10,000 steps a day, or 3–5 workouts a week"],
  ["very",1.725,"Very active","Over 10,000 steps a day plus hard training most days"],
  ["extra",1.9,"Extremely active","Physical job plus daily hard training"]];
var ACT_BY={};ACT.forEach(function(a,i){ACT_BY[a[0]]=a;a.idx=i;});
var PERI=[["","Not specified"],["no","No"],["yes","Yes"],["unsure","Not sure"],["private","Prefer not to say"]];
var COMP=[["","Not chosen"],["lose-fat","Lose body fat, keep muscle"],["build-muscle","Build muscle"],["recomp","Keep weight, improve body composition"],["maintain","Maintain my weight"]];
var CYCLE=[["","Not logged"],["period","Period"],["follicular","After period (follicular)"],["ovulation","Around ovulation"],["luteal","Before period (luteal)"],["irregular","Irregular or changing"],["na","Doesn't apply"]];
var SAFE_MIN={female:1200,male:1500};
function todayISO(){return isoOf(new Date());}
function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");if(!m)return null;var d=new Date(+m[1],+m[2]-1,+m[3]);return d.getMonth()===+m[2]-1?d:null;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function fmtDate(s){var d=parseISO(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):s;}

/* 1 tsp = 5 ml, 1 tbsp = 15 ml (3 tsp). For foods measured in ml that is exact.
   For foods in grams, grams per level tablespoon come from USDA FoodData Central standard portions
   (honey 21 g, olive oil 13,5 g, butter 14,2 g, mayonnaise 13,8 g, ghee 12,8 g), or from your own

/* ----- history ----- */
function sgMatch(e,q,f){

  if(f==="sym"&&!sgRealSym(e).length)return false;if((f==="in"||f==="watch"||f==="out")&&e.dec!==f)return false;

}

/* ----- patterns (counts only — never causation) ----- */
function sgSplitIngr(t){return String(t||"").split(/[,;\n\/]+| og | and /i).map(function(x){return x.trim().replace(/\.$/,"");}).filter(function(x){return x.length>1&&x.length<40;});}
function sgPatterns(){
  var A=loadSignals(),P={n:A.length,ready:A.length>=SG_MIN,foodsSym:[],sym:[],liked:[],why:[],ingr:[]};
  var food={},sym={},why={},ingr={};
  A.forEach(function(e){
    var k=norm(String(e.what||"").trim()),rs=sgRealSym(e),bad=rs.length>0||e.feel==="disliked";
    if(k){var f=food[k]=food[k]||{name:String(e.what).trim(),n:0,bad:0,liked:0};f.n++;if(bad)f.bad++;if(e.feel==="liked")f.liked++;}
    rs.forEach(function(s){sym[s]=(sym[s]||0)+1;});
    (e.why||[]).forEach(function(w){var x=why[w]=why[w]||{n:0,no:0};x.n++;if(e.worth==="no")x.no++;});
    if(bad){var seen={};sgSplitIngr(e.inIt).forEach(function(i){var ki=norm(i);if(seen[ki])return;seen[ki]=1;var x=ingr[ki]=ingr[ki]||{name:i,n:0};x.n++;});}
  });
  Object.keys(food).forEach(function(k){var f=food[k];if(f.bad>=2)P.foodsSym.push(f);if(f.liked>=2)P.liked.push(f);});
  P.foodsSym.sort(function(a,b){return b.bad-a.bad;});P.liked.sort(function(a,b){return b.liked-a.liked;});
  P.sym=Object.keys(sym).map(function(s){return {name:s,n:sym[s]};}).filter(function(x){return x.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,6);
  P.why=Object.keys(why).map(function(w){return {name:w,n:why[w].n,no:why[w].no};}).filter(function(x){return x.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,6);
  P.ingr=Object.keys(ingr).map(function(k){return ingr[k];}).filter(function(x){return x.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,8);
  return P;
}

  P.sym=Object.keys(sc).map(function(n){return {name:n,n:sc[n],sev:sev[n]};}).sort(function(a,b){return b.n-a.n;}).slice(0,8);
  var fc={};M.forEach(function(m){var seen={};(m.links||[]).forEach(function(l){var k=norm(String(l.name).trim());if(!k||seen[k])return;seen[k]=1;var f=fc[k]=fc[k]||{name:String(l.name).trim(),n:0,syms:{}};f.n++;mcReal(m).forEach(function(s){f.syms[s.name]=(f.syms[s.name]||0)+1;});});});

  if(t.hasAttribute("data-tab")){go(t.getAttribute("data-tab"));return;}
  if(t.hasAttribute("data-theme-set")){setUi({theme:t.getAttribute("data-theme-set")});applyTheme();render();return;}
  if(t.hasAttribute("data-strat")){var f=loadFuel(),ns=t.getAttribute("data-strat");if(f.strategy!==ns){f.strategy=ns;f.strategyStart=todayISO();saveFuel(f);}render();toast("Goal: "+STRAT_PILL[ns]);return;}
  if(t.hasAttribute("data-again")){var r=(APP.again||[])[+t.getAttribute("data-again")];if(r){var sl=slotForType("auto"),e=addToDay(r.food,r.qty,sl,r.spoon);render();toast("Added to "+sl,function(){removeEntry(e.id);render();toast("Removed");});}return;}
  if(t.hasAttribute("data-note")){openSheet({view:"note",id:t.getAttribute("data-note")});return;}
  if(t.hasAttribute("data-edit")){var en=findEntry(t.getAttribute("data-edit"));if(en)openSheet({view:"edit",id:en.id,slot:en.slot});return;}
  if(t.hasAttribute("data-slot")&&s){s.slot=t.getAttribute("data-slot");document.querySelectorAll("[data-slot]").forEach(function(b){var on=b===t;b.classList.toggle("on",on);b.setAttribute("aria-checked",on);});var ab=$('[data-act="add"]');if(ab)ab.textContent="Add to "+s.slot;return;}
  if(t.hasAttribute("data-db")){openPortion(dbFood(t.getAttribute("data-db")),null);var d_=APP.sheet;d_.qty=d_.food.defQty||100;renderSheet();return;}
  if(t.hasAttribute("data-own")){var c=DB.get(K.custom,[]).filter(function(x){return x.id===t.getAttribute("data-own");})[0];if(c){var fo=clone(c);fo.src="custom";fo.ref=c.id;fo.presets=[];openPortion(fo,fo.unit==="ml"?250:100);}return;}
  if(t.hasAttribute("data-fav")){var fv=DB.get(K.favs,[]).filter(function(x){return x.favId===t.getAttribute("data-fav");})[0];if(fv){var ff=clone(fv);if(ff.src==="db"){var dd=dbFood(ff.ref,ff.state);if(dd)ff=dd;}ff.presets=ff.presets||[];openPortion(ff,ff.defQty||(ff.unit==="ml"?250:100));}return;}
  if(t.hasAttribute("data-recent")){var rc=(APP.sRecent||[])[+t.getAttribute("data-recent")];if(rc){var rf=clone(rc.food);rf.presets=rf.presets||[];openPortion(rf,rc.qty);if(rc.spoon){APP.sheet.spoon=rc.spoon;renderSheet();}}return;}
  if(t.hasAttribute("data-drink")){var bd=baseDrink(t.getAttribute("data-drink"));openPortion(bd,usualQty(itemRef(bd))||(t.getAttribute("data-drink")==="water"||t.getAttribute("data-drink")==="sparkling"?250:200));return;}
  if(t.hasAttribute("data-barcode")){lookupBarcode(t.getAttribute("data-barcode"));return;}
  if(t.hasAttribute("data-q")&&s){s.qty=+t.getAttribute("data-q");s.spoon=t.getAttribute("data-spoon")||null;$("#p-qty").value=fmtN(s.qty);$("#p-res").innerHTML=resultHTML(s.food,s.qty);$("#p-eq").textContent=spoonEq(s.food,s.qty);document.querySelectorAll("[data-q]").forEach(function(b){b.classList.toggle("on",b===t);});return;}
  if(t.hasAttribute("data-unit")&&s){s.unit=t.getAttribute("data-unit");document.querySelectorAll("[data-unit]").forEach(function(b){b.classList.toggle("on",b===t);});return;}
  switch(a){
    case "log":openLog();break;
    case "spoon-edit":if(s){s.spoonEdit=!s.spoonEdit;renderSheet(s.spoonEdit?"#sp-g":null);}break;
    case "spoon-save":var sg=num(($("#sp-g")||{}).value);if(sg==null||sg<1||sg>60){toast("Enter a weight between 1 and 60 g");break;}var SP=DB.get(K.spoons,{});SP[itemRef(s.food)]=r1(sg);DB.set(K.spoons,SP);s.spoonEdit=false;renderSheet();toast("Saved: 1 tbsp = "+fmtN(r1(sg))+" g");break;
    case "close":closeSheet();break;
    case "back":if(s&&s.from){var fr=s.from;fr.slot=s.slot;APP.sheet=fr;renderSheet();}else closeSheet();break;
    case "go-plan":var o=ui().open||{};o["me-meas"]=true;setUi({open:o});go("me");break;
    case "undo":if(APP.undo){var u=APP.undo;APP.undo=null;u();}break;
    case "add":case "add-force":
      if(!s||s.view!=="portion")break;
      if(s.qty==null||!(s.qty>0)){$("#p-err").innerHTML='<div class="note warn">Enter an amount above 0.</div>';break;}
      if(a!=="add-force"&&isDuplicate(todayISO(),s.slot,s.food,s.qty)){$("#p-err").innerHTML='<div class="note warn">You added this a moment ago. Add it again?<br><button type="button" class="btn" data-act="add-force">Yes, add again</button></div>';break;}
      var added=addToDay(s.food,s.qty,s.slot,s.spoon),sl2=s.slot;closeSheet();if(APP.tab!=="today")APP.tab="today";render();
      toast("Added to "+sl2,function(){removeEntry(added.id);render();toast("Removed");});break;
    case "fav":if(s&&s.food){var arr=DB.get(K.favs,[]),id=favId(s.food),i=-1;arr.forEach(function(x,j){if(x.favId===id)i=j;});if(i>=0)arr.splice(i,1);else{var cf=clone(s.food);cf.favId=id;arr.push(cf);}DB.set(K.favs,arr);renderSheet();toast(i>=0?"Removed from favourites":"Added to favourites");}break;
    case "manual":openSheet({view:"manual",unit:"g",name:(s&&s.q&&!/^\d+$/.test(s.q))?s.q:(APP.tab==="foods"&&APP.fq&&!/^\d+$/.test(APP.fq)?APP.fq:""),slot:(s&&s.slot)||lastSlot(),from:s&&s.view?clone(s):null});break;
    case "manual-save":
      var nm=($("#mf-name").value||"").trim(),kc=num($("#mf-kcal").value);
      if(!nm){$("#mf-err").innerHTML='<div class="note warn">Enter a name.</div>';break;}
      if(kc==null||kc<0||kc>900){$("#mf-err").innerHTML='<div class="note warn">Enter the calories per 100 '+(s.unit||"g")+' (0–900).</div>';break;}
      var per={kcal:kc,p:num($("#mf-p").value),c:num($("#mf-c").value),f:num($("#mf-f").value),fib:null};
      if(["p","c","f"].some(function(k){return per[k]!=null&&(per[k]<0||per[k]>100);})){$("#mf-err").innerHTML='<div class="note warn">Protein, carbs and fat must be between 0 and 100 g.</div>';break;}
      var cust=DB.get(K.custom,[]),rec={id:uid(),name:nm,brand:"",unit:s.unit||"g",per100:per,ingredients:"",allergenText:"",allergens:[],traces:[]};cust.push(rec);DB.set(K.custom,cust);
      var fd=clone(rec);fd.src="custom";fd.ref=rec.id;fd.presets=[];openSheet({view:"portion",food:fd,qty:rec.unit==="ml"?250:100,slot:s.slot||lastSlot(),from:null});toast("Saved to your foods");break;
    case "edit-save":
      var E=findEntry(s.id);if(!E)break;var D=loadDiary(),day=todayISO(),ent=(D[day]||[]).filter(function(x){return x.id===s.id;})[0],bad=false;
      ent.items.forEach(function(it,j){var v=num(($("#e-q-"+j)||{}).value);if(v==null||v<0)bad=true;else{var nq=v/(ent.factor||1);if(Math.abs(nq-it.qty)>1e-9)delete ent.spoon;it.qty=nq;}});
      if(bad){toast("Enter amounts of 0 or more");break;}
      ent.slot=s.slot||ent.slot;DB.set(K.diary,D);closeSheet();render();toast("Saved");break;
    case "note-save":var nt=($("#n-text").value||"").trim();if(!nt){toast("Write something first");break;}var NS=loadNotes(),nw={id:uid(),text:nt,at:Date.now()};NS.push(nw);DB.set(K.notes,NS);setUi({noteDraft:""});render();toast("Note saved",function(){DB.set(K.notes,loadNotes().filter(function(x){return x.id!==nw.id;}));setUi({noteDraft:nt});render();toast("Removed");});break;
    case "note-upd":var ut=($("#ne-text").value||"").trim();if(!ut){toast("A note can't be empty. Use Delete instead.");break;}var NU=loadNotes();NU.forEach(function(x){if(x.id===s.id&&x.text!==ut){x.text=ut;x.edited=Date.now();}});DB.set(K.notes,NU);closeSheet();render();toast("Saved");break;
    case "note-del":s.text=$("#ne-text").value;s.confirm=true;renderSheet();break;
    case "note-del-no":s.text=$("#ne-text").value;s.confirm=false;renderSheet();break;
    case "note-del-yes":var ND=loadNotes(),gn=ND.filter(function(x){return x.id===s.id;})[0];DB.set(K.notes,ND.filter(function(x){return x.id!==s.id;}));closeSheet();render();toast("Note deleted",function(){var NR=loadNotes();NR.push(gn);DB.set(K.notes,NR);render();toast("Restored");});break;
    case "edit-del":s.confirm=true;renderSheet();break;
    case "edit-del-no":s.confirm=false;renderSheet();break;
    case "edit-del-yes":var gone=findEntry(s.id);removeEntry(s.id);closeSheet();render();toast("Deleted",function(){var D2=loadDiary(),d2=todayISO();(D2[d2]=D2[d2]||[]).push(gone);DB.set(K.diary,D2);render();toast("Restored");});break;
    case "save-meas":
      var rm=readMeas();if(rm.err.length){$("#ms-err").innerHTML='<div class="note warn">'+rm.err.map(esc).join("<br>")+'</div>';break;}
      var f2=loadFuel();f2.meas=rm.m;f2.measSaved=todayISO();f2.migrated=false;saveFuel(f2);var oo=ui().open||{};oo["me-meas"]=false;setUi({open:oo});render();toast("Plan calculated");break;
    case "own-save":var f3=loadFuel(),ov=$("#own-kcal").value.trim(),ok=num(ov);if(ov!==""&&(ok==null||ok<800||ok>6000)){toast("Use a target between 800 and 6000 kcal");break;}f3.overBy[f3.strategy].kcal=ov===""?null:Math.round(ok);saveFuel(f3);render();toast(ov===""?"Using the recommended target":"Own target saved");break;
    case "reset-maint":var f4=loadFuel();f4.maintOverride=null;f4.maintOverrideDate=null;saveFuel(f4);render();toast("Back to the calculated maintenance");break;
    case "w-save":var wv=num($("#w-today").value);if(wv==null||wv<30||wv>300){toast("Enter a weight between 30 and 300 kg");break;}var P=loadProg();P.push({id:uid(),date:todayISO(),weight:wv,waist:null,strength:"",hunger:null,energy:null,sleep:null,recovery:null,cycle:"",note:""});DB.set(K.progress,P);render();toast("Weight saved");break;
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target,s=APP.sheet;
  if(t.id==="s-q"&&s){s.q=t.value;APP.bres="";$("#s-res").innerHTML=foodsListHTML(t.value,"s");return;}
  if(t.id==="f-q"){APP.fq=t.value;APP.bres="";$("#f-res").innerHTML=foodsListHTML(t.value,"f");return;}
  if(t.id==="n-text"){setUi({noteDraft:t.value});return;}
  if(t.id==="p-qty"&&s){s.qty=num(t.value);s.spoon=null;$("#p-res").innerHTML=resultHTML(s.food,s.qty);$("#p-eq").textContent=spoonEq(s.food,s.qty);document.querySelectorAll("[data-q]").forEach(function(b){b.classList.toggle("on",s.qty!=null&&r1(+b.getAttribute("data-q"))===r1(s.qty));});return;}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.hasAttribute("data-cons")){var p=loadProfile(),id=t.getAttribute("data-cons");p.cons.forEach(function(c){if(c.id===id)c.status=t.value;});p.setup=true;saveProfile(p);toast("Food profile saved");return;}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&APP.sheet)closeSheet();
  if(ev.key==="Enter"&&(ev.target.id==="s-q"||ev.target.id==="f-q")){var d=String(ev.target.value).replace(/\s/g,"");if(/^\d{8,14}$/.test(d)){ev.preventDefault();lookupBarcode(d);}}
});
document.addEventListener("toggle",function(ev){var d=ev.target;if(!d||!d.getAttribute||!d.getAttribute("data-fold"))return;var o=ui().open||{};o[d.getAttribute("data-fold")]=d.open;setUi({open:o});},true);

applyTheme();
var _t=ui().tab2;if(_t==="notes"){_t="signals";APP.sgSeg="notes";}else APP.sgSeg=["notes","mornings"].indexOf(ui().sgSeg)>=0?ui().sgSeg:"detective";
APP.tab=["today","foods","signals","me"].indexOf(_t)>=0?_t:"today";
render();
window.BFLFOOD={_debug:{APP:APP,calcFuel:calcFuel,loadFuel:loadFuel,signalsCSV:signalsCSV,morningsCSV:morningsCSV,biConsistency:biConsistency,biPatterns:biPatterns,biFuel:biFuel,biInsights:biInsights,biSuggestions:biSuggestions,dayCtx:dayCtx,dayAdd:dayAdd,lastDays:lastDays,biWindow:biWindow,mcPatterns:mcPatterns,mcRecentFoods:mcRecentFoods,sgPatterns:sgPatterns}};
})();
